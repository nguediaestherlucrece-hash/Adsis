<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
   <link rel="stylesheet" href="style/nouvelutilisateur.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>projetarchiweb</title>
  </head>
<body>

<!-- Bouton pour ouvrir la modal (test) -->
<div class="text-center mt-5">
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newUserModal">
    + Nouvel utilisateur
  </button>
</div>

<!-- MODAL -->
<div class="modal fade" id="newUserModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content custom-modal">

      <!-- Header -->
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">Nouvel utilisateur</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- Body -->
      <div class="modal-body">

        <!-- Nom complet -->
        <div class="mb-3">
          <label class="form-label">Nom complet</label>
          <input type="text" class="form-control custom-input" placeholder="Ex. Marie Dupont">
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control custom-input" placeholder="Ex. marie.dupont@school.fr">
        </div>

        <!-- Rôle -->
        <div class="mb-4">
          <label class="form-label">Rôle</label>
          <select class="form-select custom-input">
            <option selected>Étudiant</option>
            <option>Enseignant</option>
            <option>Assistant pédagogique</option>
            <option>Surveillant</option>
          </select>
        </div>

        <!-- Boutons -->
        <div class="d-flex justify-content-end gap-3">
          <button class="btn btn-light btn-cancel" data-bs-dismiss="modal">Annuler</button>
          <button class="btn btn-primary btn-create">Créer</button>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
