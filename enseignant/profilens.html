<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ADSIS – Mon profil</title>
    <style>
        /* ===== ADSIS – shared.css ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
          --primary:       #3B55E6;
          --primary-dark:  #2a3fc2;
          --primary-light: #6478f0;
          --accent:        #7C3AED;
          --teal:          #0d9488;
          --surface:       #ffffff;
          --surface-2:     #f4f6ff;
          --bg:            #f0f2ff;
          --text:          #1a1f36;
          --text-muted:    #6b7280;
          --border:        #e2e5f1;
          --danger:        #ef4444;
          --warning:       #f59e0b;
          --success:       #10b981;
          --sidebar-w:     300px;
          --topbar-h:      64px;
          --radius:        16px;
          --radius-sm:     10px;
          --shadow:        0 4px 20px rgba(59,85,230,0.10);
          --shadow-card:   0 2px 12px rgba(0,0,0,0.07);
          --transition:    0.22s cubic-bezier(0.4,0,0.2,1);
          --font:          'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); }

        /* ══ SIDEBAR ══ */
        .sidebar {
          position: fixed; top: 0; left: 0;
          width: var(--sidebar-w); height: 100%;
          background: var(--surface);
          border-right: 1px solid var(--border);
          display: flex; flex-direction: column;
          z-index: 400;
          transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
          overflow-y: auto; overflow-x: hidden;
        }
        .sidebar-header {
          display: flex; align-items: center; gap: 12px;
          padding: 22px 20px 18px;
          border-bottom: 1px solid var(--border);
          flex-shrink: 0;
        }
        .sidebar-logo {
          width: 40px; height: 40px; border-radius: 10px;
          background: linear-gradient(135deg, var(--primary), var(--accent));
          display: flex; align-items: center; justify-content: center;
          overflow: hidden; flex-shrink: 0;
        }
        .sidebar-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
        .logo-txt-fb { color: #fff; font-size: 20px; }
        .sidebar-brand { font-size: 1.25rem; font-weight: 800; color: var(--text); letter-spacing: -0.3px; flex: 1; }

        .sidebar-close {
          display: none;
          background: none; border: none;
          font-size: 1.4rem; line-height: 1;
          color: var(--text-muted); cursor: pointer;
          padding: 2px 8px; border-radius: 6px;
          transition: background var(--transition), color var(--transition);
        }
        .sidebar-close:hover { background: var(--surface-2); color: var(--text); }

        .sidebar-etab { padding: 16px 20px 8px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
        .etab-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); }
        .etab-name  { font-size: 0.95rem; font-weight: 700; color: var(--text); }

        .sidebar-nav { flex: 1; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }

        .nav-item {
          display: flex; align-items: center; gap: 12px;
          padding: 11px 14px; border-radius: 12px;
          font-size: 0.93rem; font-weight: 500; color: var(--text-muted);
          text-decoration: none;
          transition: background var(--transition), color var(--transition);
          cursor: pointer; border: none; background: none;
          width: 100%; text-align: left; font-family: var(--font);
        }
        .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; stroke: currentColor; fill: none; }
        .nav-item:hover { background: var(--surface-2); color: var(--primary); }
        .nav-item.active {
          background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
          color: #fff; font-weight: 600;
          box-shadow: 0 4px 14px rgba(59,85,230,0.28);
        }
        .nav-logout { color: var(--danger); }
        .nav-logout:hover { background: #fef2f2; color: #dc2626; }

        .sidebar-footer { padding: 10px 12px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }

        /* ══ OVERLAY ══ */
        .sidebar-overlay {
          display: none; position: fixed; inset: 0;
          background: rgba(0,0,0,0.45); z-index: 399;
          backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
          cursor: pointer;
        }
        .sidebar-overlay.open { display: block; }

        /* ══ MAIN WRAP ══ */
        .main-wrap {
          margin-left: var(--sidebar-w);
          min-height: 100vh; display: flex; flex-direction: column;
          transition: margin-left 0.28s cubic-bezier(0.4,0,0.2,1);
        }

        /* ══ TOPBAR ══ */
        .topbar {
          position: sticky; top: 0; z-index: 100;
          min-height: var(--topbar-h);
          background: var(--surface); border-bottom: 1px solid var(--border);
          display: flex; align-items: center; gap: 12px;
          padding: 0 24px;
          box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }

        /* BURGER — caché sur desktop */
        .burger {
          display: none;
          flex-direction: column; justify-content: center; gap: 5px;
          background: none; border: none; cursor: pointer;
          padding: 8px 6px; border-radius: 8px; flex-shrink: 0;
          transition: background var(--transition);
          -webkit-tap-highlight-color: transparent;
        }
        .burger:hover { background: var(--surface-2); }
        .burger span {
          display: block; width: 22px; height: 2.5px;
          background: var(--text); border-radius: 2px;
          pointer-events: none;
        }

        .topbar-title { flex: 1; min-width: 0; }
        .topbar-title h2 {
          font-size: 1.05rem; font-weight: 700; color: var(--text);
          line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .topbar-date { font-size: 0.78rem; color: var(--text-muted); }

        .topbar-user { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .user-info   { display: flex; flex-direction: column; align-items: flex-end; }
        .user-name   { font-size: 0.88rem; font-weight: 700; color: var(--text); line-height: 1.2; }
        .user-email  { font-size: 0.73rem; color: var(--text-muted); }

        .avatar {
          width: 38px; height: 38px; border-radius: 50%;
          background: linear-gradient(135deg, var(--primary), var(--accent));
          color: #fff; font-weight: 700; font-size: 0.88rem;
          display: flex; align-items: center; justify-content: center;
          flex-shrink: 0; cursor: pointer; user-select: none;
        }

        /* ══ CONTENT ══ */
        .content { flex: 1; padding: 24px 28px; max-width: 1400px; width: 100%; }

        /* ══ BACK BTN ══ */
        .back-btn {
          width: 36px; height: 36px; border-radius: 10px;
          border: 1.5px solid var(--border); background: var(--surface);
          display: flex; align-items: center; justify-content: center;
          cursor: pointer; color: var(--text); flex-shrink: 0;
          transition: background var(--transition), border-color var(--transition), color var(--transition);
        }
        .back-btn:hover { background: var(--surface-2); border-color: var(--primary); color: var(--primary); }

        /* ══ RESPONSIVE ══ */
        @media (max-width: 1024px) { :root { --sidebar-w: 260px; } }

        @media (max-width: 768px) {
          /* Sidebar tiroir */
          .sidebar { transform: translateX(-100%); width: min(300px, 85vw); z-index: 500; }
          .sidebar.open { transform: translateX(0); box-shadow: 6px 0 40px rgba(0,0,0,0.22); }
          .sidebar-close { display: flex; align-items: center; justify-content: center; }
          .sidebar-overlay.open { display: block; }
          /* Layout */
          .main-wrap { margin-left: 0 !important; }
          /* Burger visible */
          .burger { display: flex; }
          /* Cacher le texte user */
          .user-info { display: none; }
          .topbar { padding: 0 14px; gap: 10px; }
          .content { padding: 16px 14px; }
        }

        @media (max-width: 480px) {
          .content { padding: 12px 10px; }
          .topbar-title h2 { font-size: 0.95rem; }
        }

        /* ===== ADSIS – profil.css ===== */

        /* ── Back btn (shared with appel) ── */
        .back-btn {
          width: 36px; height: 36px;
          border-radius: 10px;
          border: 1.5px solid var(--border);
          background: var(--surface);
          display: flex; align-items: center; justify-content: center;
          cursor: pointer;
          color: var(--text);
          flex-shrink: 0;
          transition: background var(--transition), border-color var(--transition);
        }
        .back-btn:hover { background: var(--surface-2); border-color: var(--primary); color: var(--primary); }

        /* ── Profile hero ── */
        .profile-hero {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          padding: 32px 28px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 10px;
          text-align: center;
          margin-bottom: 20px;
          box-shadow: var(--shadow-card);
          animation: fadeUp 0.35s both;
        }

        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(14px); }
          to   { opacity: 1; transform: translateY(0); }
        }

        .profile-avatar-wrap {
          position: relative;
          margin-bottom: 4px;
        }

        .profile-avatar {
          width: 88px; height: 88px;
          border-radius: 22px;
          background: linear-gradient(135deg, var(--primary), var(--accent));
          color: #fff;
          font-size: 2rem;
          font-weight: 800;
          display: flex; align-items: center; justify-content: center;
          box-shadow: 0 6px 20px rgba(59,85,230,0.3);
          user-select: none;
        }

        .avatar-edit-btn {
          position: absolute;
          bottom: -6px; right: -6px;
          width: 28px; height: 28px;
          border-radius: 50%;
          background: var(--primary);
          border: 2px solid var(--surface);
          color: #fff;
          display: flex; align-items: center; justify-content: center;
          cursor: pointer;
          transition: background var(--transition), transform var(--transition);
        }
        .avatar-edit-btn:hover { background: var(--primary-dark); transform: scale(1.1); }

        .profile-hero-info { display: flex; flex-direction: column; align-items: center; gap: 4px; }

        .profile-hero-info h2 {
          font-size: 1.3rem;
          font-weight: 800;
          color: var(--text);
        }

        .prof-role-label {
          font-size: 0.72rem;
          font-weight: 700;
          color: var(--text-muted);
          letter-spacing: 1px;
          text-transform: uppercase;
        }

        .prof-role-badge {
          display: inline-block;
          background: #ede9fe;
          color: var(--accent);
          font-size: 0.8rem;
          font-weight: 700;
          border-radius: 8px;
          padding: 4px 12px;
          margin-top: 4px;
        }

        .profile-etab-badge {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-top: 10px;
          padding: 10px 18px;
          background: var(--surface-2);
          border-radius: 12px;
          border: 1px solid var(--border);
        }

        .etab-logo {
          width: 36px; height: 36px;
          border-radius: 8px;
          background: var(--surface);
          border: 1px solid var(--border);
          display: flex; align-items: center; justify-content: center;
          overflow: hidden;
        }
        .etab-logo img { width: 100%; height: 100%; object-fit: cover; }

        .profile-etab-badge span {
          font-size: 0.9rem;
          font-weight: 700;
          color: var(--text);
        }

        /* ── Profile section ── */
        .profile-section {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          padding: 24px 28px;
          margin-bottom: 18px;
          box-shadow: var(--shadow-card);
          animation: fadeUp 0.35s both;
        }

        .profile-section:nth-child(2) { animation-delay: 0.08s; }
        .profile-section:nth-child(3) { animation-delay: 0.14s; }

        .section-heading {
          display: flex;
          align-items: center;
          gap: 10px;
          font-size: 1rem;
          font-weight: 800;
          color: var(--text);
          margin-bottom: 22px;
          padding-bottom: 14px;
          border-bottom: 1px solid var(--border);
        }
        .section-heading svg { color: var(--primary); }

        /* ── Form grid ── */
        .form-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 18px;
        }

        .form-field {
          display: flex;
          flex-direction: column;
          gap: 7px;
        }

        .form-field-full { grid-column: 1 / -1; }

        .form-field label {
          font-size: 0.82rem;
          font-weight: 600;
          color: var(--text-muted);
          display: flex;
          align-items: center;
          gap: 5px;
        }
        .form-field label svg { flex-shrink: 0; }

        .form-field input {
          padding: 12px 14px;
          border: 1.5px solid var(--border);
          border-radius: var(--radius-sm);
          font-size: 0.9rem;
          color: var(--text);
          background: #f9faff;
          outline: none;
          transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
          font-family: var(--font);
        }
        .form-field input:focus {
          border-color: var(--primary);
          background: #fff;
          box-shadow: 0 0 0 3px rgba(59,85,230,0.1);
        }
        .form-field input:disabled {
          background: var(--surface-2);
          color: var(--text-muted);
          cursor: not-allowed;
        }
        .form-field input::placeholder { color: #c4c9dc; }

        /* ── Form actions ── */
        .form-actions {
          display: flex;
          justify-content: flex-end;
          margin-top: 22px;
        }

        .btn-save {
          display: inline-flex;
          align-items: center;
          gap: 9px;
          padding: 13px 24px;
          background: linear-gradient(135deg, var(--primary), var(--primary-dark));
          color: #fff;
          border: none;
          border-radius: 12px;
          font-size: 0.92rem;
          font-weight: 700;
          cursor: pointer;
          box-shadow: 0 4px 14px rgba(59,85,230,0.35);
          transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
          font-family: var(--font);
        }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(59,85,230,0.4); }
        .btn-save:active { transform: translateY(0); }

        .btn-secondary {
          background: linear-gradient(135deg, #374151, #1f2937);
          box-shadow: 0 4px 14px rgba(0,0,0,0.2);
        }
        .btn-secondary:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.3); }

        .save-feedback {
          margin-top: 12px;
          font-size: 0.85rem;
          font-weight: 600;
          min-height: 20px;
          text-align: right;
        }
        .save-feedback.success { color: var(--success); }
        .save-feedback.error   { color: var(--danger); }

        /* ── Toast ── */
        .toast {
          position: fixed;
          bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
          background: var(--text);
          color: #fff;
          padding: 12px 24px;
          border-radius: 12px;
          font-size: 0.9rem;
          font-weight: 600;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.3s, transform 0.3s;
          z-index: 500;
          white-space: nowrap;
          box-shadow: 0 6px 24px rgba(0,0,0,0.25);
          max-width: calc(100vw - 32px);
          text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success-toast { background: var(--success); }
        .toast.error-toast   { background: var(--danger); }

        /* ── Responsive ── */
        @media (max-width: 700px) {
          .form-grid { grid-template-columns: 1fr; }
          .form-field-full { grid-column: 1; }
        }

        @media (max-width: 520px) {
          .profile-hero { padding: 24px 16px; }
          .profile-section { padding: 20px 16px; }
          .btn-save { width: 100%; justify-content: center; }
          .form-actions { justify-content: stretch; }
        }

    </style>
</head>

    // ── Sidebar toggle ─────────────────────────────────────────────────────────────
    (function initSidebar() {
      const sidebar      = document.getElementById('sidebar');
      const overlay      = document.getElementById('sidebar-overlay');
      const burger       = document.getElementById('burger');
      const sidebarClose = document.getElementById('sidebar-close');

      if (!sidebar) return;

      function openSidebar() {
        sidebar.classList.add('open');
        if (overlay) overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeSidebar() {
        sidebar.classList.remove('open');
        if (overlay) overlay.classList.remove('open');
        document.body.style.overflow = '';
      }

      // Burger click
      if (burger) {
        burger.addEventListener('click', function(e) {
          e.stopPropagation();
          if (sidebar.classList.contains('open')) closeSidebar();
          else openSidebar();
        });
      }

      // Close ✕ button inside sidebar
      if (sidebarClose) {
        sidebarClose.addEventListener('click', closeSidebar);
      }

      // Overlay click
      if (overlay) {
        overlay.addEventListener('click', closeSidebar);
      }

      // Close on Escape
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeSidebar();
      });

      // Close sidebar when navigating (click on nav-item)
      sidebar.querySelectorAll('.nav-item').forEach(function(item) {
        item.addEventListener('click', function() {
          // Only close on mobile
          if (window.innerWidth <= 768) closeSidebar();
        });
      });
    })();

<script>
    /* ===== ADSIS – profil.js ===== */

    const user = JSON.parse(localStorage.getItem('adsis_user') || '{}');

    // ── Populate fields ───────────────────────────────────────────────────────────
    function splitName(name = '') {
      const parts = name.trim().split(' ');
      return { prenom: parts[0] || '', nom: parts.slice(1).join(' ') || '' };
    }

    const { prenom, nom } = splitName(user.name);
    const el = id => document.getElementById(id);

    el('f-prenom').value  = prenom;
    el('f-nom').value     = nom;
    el('f-email').value   = user.email  || '';
    el('f-tel').value     = user.phone  || '';
    el('f-adresse').value = user.address || '';
    el('f-etab').value    = user.etablissement || '';

    el('prof-name').textContent = user.name || 'Utilisateur';
    el('prof-etab').textContent = user.etablissement || '';

    // Avatar initials
    const initials = (user.name || 'U').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
    el('prof-avatar').textContent = initials;

    // ── Toast helper ──────────────────────────────────────────────────────────────
    let toastTimer;
    function showToast(msg, type = 'success') {
      const t = el('toast');
      t.textContent = msg;
      t.className = `toast ${type}-toast show`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.className = 'toast'; }, 3500);
    }

    // ── Save profile ──────────────────────────────────────────────────────────────
    el('btn-save').addEventListener('click', async () => {
      const prenom  = el('f-prenom').value.trim();
      const nom     = el('f-nom').value.trim();
      const email   = el('f-email').value.trim();
      const phone   = el('f-tel').value.trim();
      const address = el('f-adresse').value.trim();
      const feedback = el('save-feedback');

      if (!prenom || !nom || !email) {
        feedback.textContent = 'Veuillez remplir les champs obligatoires.';
        feedback.className = 'save-feedback error';
        return;
      }

      // Update local storage
      const updated = {
        ...user,
        name: `${prenom} ${nom}`,
        email, phone, address,
      };
      localStorage.setItem('adsis_user', JSON.stringify(updated));

      // Update UI
      el('prof-name').textContent = updated.name;
      document.querySelectorAll('#user-name-top').forEach(e => e.textContent = updated.name);
      const newInitials = updated.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
      document.querySelectorAll('.avatar, #prof-avatar').forEach(e => e.textContent = newInitials);

      // Try to sync with backend
      try {
        const token = localStorage.getItem('adsis_token') || '';
        await fetch('/api/user/profile', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify(updated),
        });
      } catch { /* offline – already saved locally */ }

      feedback.textContent = 'Modifications enregistrées !';
      feedback.className = 'save-feedback success';
      showToast('Profil mis à jour avec succès !', 'success');
      setTimeout(() => { feedback.textContent = ''; feedback.className = 'save-feedback'; }, 4000);
    });

    // ── Change password ───────────────────────────────────────────────────────────
    el('btn-change-pw').addEventListener('click', async () => {
      const cur  = el('f-pw-cur').value;
      const nw   = el('f-pw-new').value;
      const conf = el('f-pw-conf').value;

      if (!cur || !nw || !conf) {
        showToast('Veuillez remplir tous les champs de sécurité.', 'error');
        return;
      }
      if (nw.length < 6) {
        showToast('Le mot de passe doit comporter au moins 6 caractères.', 'error');
        return;
      }
      if (nw !== conf) {
        showToast('Les nouveaux mots de passe ne correspondent pas.', 'error');
        return;
      }

      try {
        const token = localStorage.getItem('adsis_token') || '';
        const res = await fetch('/api/user/password', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ currentPassword: cur, newPassword: nw }),
        });
        if (!res.ok) throw new Error();
        showToast('Mot de passe modifié avec succès !', 'success');
        el('f-pw-cur').value = '';
        el('f-pw-new').value = '';
        el('f-pw-conf').value = '';
      } catch {
        // Demo: accept any change
        showToast('Mot de passe modifié avec succès ! (mode démo)', 'success');
        el('f-pw-cur').value = '';
        el('f-pw-new').value = '';
        el('f-pw-conf').value = '';
      }
    });

</script>
