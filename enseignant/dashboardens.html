<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADSIS – Tableau de bord</title>
    <link rel="stylesheet" href="../style/shared.css" />
    <link rel="stylesheet" href="../style/dashboardens.css" />
</head>
<body>

<!-- ══════════════ SIDEBAR ══════════════ -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo">
            <img src="../assets/image.png" alt="ADSIS" onerror="this.style.display='none';document.querySelector('.logo-txt-fb').style.display='flex';" />
            <span class="logo-txt-fb" style="display:none;">✔</span>
        </div>
        <span class="sidebar-brand">ADSIS</span>
        <button class="sidebar-close" id="sidebar-close" aria-label="Fermer le menu">✕</button>
    </div>

    <div class="sidebar-etab">
        <span class="etab-label">ÉTABLISSEMENT</span>
        <span class="etab-name" id="sb-etab">Saint Jean Ingénieur</span>
    </div>

    <nav class="sidebar-nav">
        <a href="dashboardens.html" class="nav-item active" data-page="dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            <span>Tableau de bord</span>
        </a>
        <a href="emploiens.html" class="nav-item" data-page="emploi">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>Emploi de temps</span>
        </a>
        <a href="appel.html" class="nav-item" data-page="appel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <span>Appel</span>
        </a>
        <a href="profil.html" class="nav-item" data-page="profil">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Mon profil</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <button class="nav-item nav-logout" id="btn-logout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>Déconnexion</span>
        </button>
    </div>
</aside>

<!-- Overlay for mobile -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<!-- ══════════════ MAIN ══════════════ -->
<div class="main-wrap">

    <!-- TOPBAR -->
    <header class="topbar">
        <button class="burger" id="burger" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
        <div class="topbar-title">
            <h2 id="page-title">Tableau de bord</h2>
            <p id="page-date" class="topbar-date"></p>
        </div>
        <div class="topbar-user">
            <div class="user-info">
                <span id="user-name-top" class="user-name">Marie Dupont</span>
                <span id="user-email-top" class="user-email">marie.dupont@adsis.com</span>
            </div>
            <div class="avatar" id="user-avatar">DM</div>
        </div>
    </header>

    <!-- CONTENT -->
    <main class="content">

        <!-- Stats rapides -->
        <section class="stats-grid">
            <div class="stat-card stat-presence">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Taux de présence</span>
                    <span class="stat-value" id="stat-presence">87%</span>
                </div>
            </div>
            <div class="stat-card stat-heures">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Heures cette semaine</span>
                    <span class="stat-value" id="stat-heures">12h</span>
                </div>
            </div>
            <div class="stat-card stat-cours">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Cours du jour</span>
                    <span class="stat-value" id="stat-cours">3</span>
                </div>
            </div>
            <div class="stat-card stat-etudiants">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Étudiants total</span>
                    <span class="stat-value" id="stat-etudiants">45</span>
                </div>
            </div>
        </section>

        <!-- Prochain cours – Faire l'appel -->
        <section class="next-course-section" id="next-course-section">
            <!-- Populated by JS -->
        </section>

        <!-- Cours du jour -->
        <section class="today-section">
            <div class="section-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <h3>Cours du jour</h3>
            </div>
            <div class="today-list" id="today-list">
                <!-- Populated by JS -->
            </div>
        </section>

    </main>
</div>

<script src="../script/shared.js"></script>
<script src="../script/dashboardens.js"></script>
</body>
</html>
