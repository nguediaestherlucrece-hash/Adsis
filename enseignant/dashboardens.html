<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ADSIS – Tableau de bord</title>
    <style>
        /* ===== ADSIS – shared.css ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
          --primary:       #3B55E6;
          --primary-dark:  #2a3fc2;
          --primary-light: #6478f0;
          --accent:        #7C3AED;
          --teal:          #0d9488;
          --surface:       #ffffff;
          --surface-2:     #f4f6ff;
          --bg:            #f0f2ff;
          --text:          #1a1f36;
          --text-muted:    #6b7280;
          --border:        #e2e5f1;
          --danger:        #ef4444;
          --warning:       #f59e0b;
          --success:       #10b981;
          --sidebar-w:     300px;
          --topbar-h:      64px;
          --radius:        16px;
          --radius-sm:     10px;
          --shadow:        0 4px 20px rgba(59,85,230,0.10);
          --shadow-card:   0 2px 12px rgba(0,0,0,0.07);
          --transition:    0.22s cubic-bezier(0.4,0,0.2,1);
          --font:          'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); }

        /* ══ SIDEBAR ══ */
        .sidebar {
          position: fixed; top: 0; left: 0;
          width: var(--sidebar-w); height: 100%;
          background: var(--surface);
          border-right: 1px solid var(--border);
          display: flex; flex-direction: column;
          z-index: 400;
          transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
          overflow-y: auto; overflow-x: hidden;
        }
        .sidebar-header {
          display: flex; align-items: center; gap: 12px;
          padding: 22px 20px 18px;
          border-bottom: 1px solid var(--border);
          flex-shrink: 0;
        }
        .sidebar-logo {
          width: 40px; height: 40px; border-radius: 10px;
          background: linear-gradient(135deg, var(--primary), var(--accent));
          display: flex; align-items: center; justify-content: center;
          overflow: hidden; flex-shrink: 0;
        }
        .sidebar-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
        .logo-txt-fb { color: #fff; font-size: 20px; }
        .sidebar-brand { font-size: 1.25rem; font-weight: 800; color: var(--text); letter-spacing: -0.3px; flex: 1; }

        .sidebar-close {
          display: none;
          background: none; border: none;
          font-size: 1.4rem; line-height: 1;
          color: var(--text-muted); cursor: pointer;
          padding: 2px 8px; border-radius: 6px;
          transition: background var(--transition), color var(--transition);
        }
        .sidebar-close:hover { background: var(--surface-2); color: var(--text); }

        .sidebar-etab { padding: 16px 20px 8px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
        .etab-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); }
        .etab-name  { font-size: 0.95rem; font-weight: 700; color: var(--text); }

        .sidebar-nav { flex: 1; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }

        .nav-item {
          display: flex; align-items: center; gap: 12px;
          padding: 11px 14px; border-radius: 12px;
          font-size: 0.93rem; font-weight: 500; color: var(--text-muted);
          text-decoration: none;
          transition: background var(--transition), color var(--transition);
          cursor: pointer; border: none; background: none;
          width: 100%; text-align: left; font-family: var(--font);
        }
        .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; stroke: currentColor; fill: none; }
        .nav-item:hover { background: var(--surface-2); color: var(--primary); }
        .nav-item.active {
          background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
          color: #fff; font-weight: 600;
          box-shadow: 0 4px 14px rgba(59,85,230,0.28);
        }
        .nav-logout { color: var(--danger); }
        .nav-logout:hover { background: #fef2f2; color: #dc2626; }

        .sidebar-footer { padding: 10px 12px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }

        /* ══ OVERLAY ══ */
        .sidebar-overlay {
          display: none; position: fixed; inset: 0;
          background: rgba(0,0,0,0.45); z-index: 399;
          backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
          cursor: pointer;
        }
        .sidebar-overlay.open { display: block; }

        /* ══ MAIN WRAP ══ */
        .main-wrap {
          margin-left: var(--sidebar-w);
          min-height: 100vh; display: flex; flex-direction: column;
          transition: margin-left 0.28s cubic-bezier(0.4,0,0.2,1);
        }

        /* ══ TOPBAR ══ */
        .topbar {
          position: sticky; top: 0; z-index: 100;
          min-height: var(--topbar-h);
          background: var(--surface); border-bottom: 1px solid var(--border);
          display: flex; align-items: center; gap: 12px;
          padding: 0 24px;
          box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }

        /* BURGER — caché sur desktop */
        .burger {
          display: none;
          flex-direction: column; justify-content: center; gap: 5px;
          background: none; border: none; cursor: pointer;
          padding: 8px 6px; border-radius: 8px; flex-shrink: 0;
          transition: background var(--transition);
          -webkit-tap-highlight-color: transparent;
        }
        .burger:hover { background: var(--surface-2); }
        .burger span {
          display: block; width: 22px; height: 2.5px;
          background: var(--text); border-radius: 2px;
          pointer-events: none;
        }

        .topbar-title { flex: 1; min-width: 0; }
        .topbar-title h2 {
          font-size: 1.05rem; font-weight: 700; color: var(--text);
          line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .topbar-date { font-size: 0.78rem; color: var(--text-muted); }

        .topbar-user { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .user-info   { display: flex; flex-direction: column; align-items: flex-end; }
        .user-name   { font-size: 0.88rem; font-weight: 700; color: var(--text); line-height: 1.2; }
        .user-email  { font-size: 0.73rem; color: var(--text-muted); }

        .avatar {
          width: 38px; height: 38px; border-radius: 50%;
          background: linear-gradient(135deg, var(--primary), var(--accent));
          color: #fff; font-weight: 700; font-size: 0.88rem;
          display: flex; align-items: center; justify-content: center;
          flex-shrink: 0; cursor: pointer; user-select: none;
        }

        /* ══ CONTENT ══ */
        .content { flex: 1; padding: 24px 28px; max-width: 1400px; width: 100%; }

        /* ══ BACK BTN ══ */
        .back-btn {
          width: 36px; height: 36px; border-radius: 10px;
          border: 1.5px solid var(--border); background: var(--surface);
          display: flex; align-items: center; justify-content: center;
          cursor: pointer; color: var(--text); flex-shrink: 0;
          transition: background var(--transition), border-color var(--transition), color var(--transition);
        }
        .back-btn:hover { background: var(--surface-2); border-color: var(--primary); color: var(--primary); }

        /* ══ RESPONSIVE ══ */
        @media (max-width: 1024px) { :root { --sidebar-w: 260px; } }

        @media (max-width: 768px) {
          /* Sidebar tiroir */
          .sidebar { transform: translateX(-100%); width: min(300px, 85vw); z-index: 500; }
          .sidebar.open { transform: translateX(0); box-shadow: 6px 0 40px rgba(0,0,0,0.22); }
          .sidebar-close { display: flex; align-items: center; justify-content: center; }
          .sidebar-overlay.open { display: block; }
          /* Layout */
          .main-wrap { margin-left: 0 !important; }
          /* Burger visible */
          .burger { display: flex; }
          /* Cacher le texte user */
          .user-info { display: none; }
          .topbar { padding: 0 14px; gap: 10px; }
          .content { padding: 16px 14px; }
        }

        @media (max-width: 480px) {
          .content { padding: 12px 10px; }
          .topbar-title h2 { font-size: 0.95rem; }
        }

        /* ===== ADSIS – dashboardens.css ===== */

        /* ── Stats grid ── */
        .stats-grid {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 16px;
          margin-bottom: 28px;
        }

        .stat-card {
          background: var(--surface);
          border-radius: var(--radius);
          padding: 20px;
          display: flex;
          align-items: center;
          gap: 16px;
          box-shadow: var(--shadow-card);
          border: 1px solid var(--border);
          transition: transform var(--transition), box-shadow var(--transition);
          animation: fadeUp 0.4s both;
        }

        .stat-card:nth-child(1) { animation-delay: 0.05s; }
        .stat-card:nth-child(2) { animation-delay: 0.10s; }
        .stat-card:nth-child(3) { animation-delay: 0.15s; }
        .stat-card:nth-child(4) { animation-delay: 0.20s; }

        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(16px); }
          to   { opacity: 1; transform: translateY(0); }
        }

        .stat-card:hover {
          transform: translateY(-3px);
          box-shadow: 0 8px 24px rgba(59,85,230,0.12);
        }

        .stat-icon {
          width: 48px; height: 48px;
          border-radius: 12px;
          display: flex; align-items: center; justify-content: center;
          flex-shrink: 0;
        }

        .stat-icon svg { width: 22px; height: 22px; }

        .stat-presence .stat-icon { background: #ede9fe; color: var(--accent); }
        .stat-heures   .stat-icon { background: #dbeafe; color: #2563eb; }
        .stat-cours    .stat-icon { background: #dcfce7; color: var(--success); }
        .stat-etudiants .stat-icon { background: #fef3c7; color: var(--warning); }

        .stat-info { display: flex; flex-direction: column; gap: 2px; }
        .stat-label {
          font-size: 0.75rem;
          font-weight: 600;
          color: var(--text-muted);
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }
        .stat-value {
          font-size: 1.6rem;
          font-weight: 800;
          color: var(--text);
          line-height: 1.1;
        }

        /* ── Next course ── */
        .next-course-section {
          margin-bottom: 28px;
          animation: fadeUp 0.4s 0.25s both;
        }

        .next-course-card {
          background: linear-gradient(135deg, #3B55E6 0%, #7C3AED 100%);
          border-radius: var(--radius);
          padding: 24px 28px;
          display: flex;
          align-items: center;
          gap: 20px;
          color: #fff;
          box-shadow: 0 8px 32px rgba(59,85,230,0.35);
          flex-wrap: wrap;
        }

        .next-course-icon {
          width: 56px; height: 56px;
          background: rgba(255,255,255,0.2);
          border-radius: 14px;
          display: flex; align-items: center; justify-content: center;
          flex-shrink: 0;
        }
        .next-course-icon svg { width: 26px; height: 26px; stroke: #fff; }

        .next-course-info { flex: 1; min-width: 160px; }
        .next-course-info h3 {
          font-size: 1.2rem;
          font-weight: 800;
          margin-bottom: 4px;
        }
        .next-course-meta {
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
          margin-top: 6px;
        }
        .course-badge {
          display: inline-flex;
          align-items: center;
          gap: 5px;
          background: rgba(255,255,255,0.2);
          border-radius: 20px;
          padding: 4px 10px;
          font-size: 0.8rem;
          font-weight: 500;
        }
        .course-badge svg { width: 13px; height: 13px; }

        .btn-appel {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          background: #fff;
          color: var(--primary);
          font-weight: 700;
          font-size: 0.95rem;
          border: none;
          border-radius: 12px;
          padding: 14px 22px;
          cursor: pointer;
          transition: transform var(--transition), box-shadow var(--transition);
          text-decoration: none;
          white-space: nowrap;
          font-family: var(--font);
          box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }
        .btn-appel svg { width: 16px; height: 16px; }
        .btn-appel:hover {
          transform: translateY(-2px);
          box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .btn-appel:active { transform: translateY(0); }

        .no-course-card {
          background: var(--surface);
          border: 1.5px dashed var(--border);
          border-radius: var(--radius);
          padding: 32px;
          text-align: center;
          color: var(--text-muted);
          font-size: 0.95rem;
        }

        /* ── Today section ── */
        .today-section {
          animation: fadeUp 0.4s 0.3s both;
        }

        .section-header {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-bottom: 16px;
        }
        .section-header svg { width: 20px; height: 20px; color: var(--primary); }
        .section-header h3 { font-size: 1.05rem; font-weight: 700; color: var(--text); }

        .today-list {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }

        .today-item {
          background: var(--surface);
          border-radius: var(--radius-sm);
          padding: 16px 20px;
          display: flex;
          align-items: center;
          gap: 16px;
          border: 1px solid var(--border);
          box-shadow: var(--shadow-card);
          transition: transform var(--transition), box-shadow var(--transition);
        }
        .today-item:hover {
          transform: translateX(4px);
          box-shadow: 0 4px 16px rgba(59,85,230,0.10);
        }

        .today-strip {
          width: 4px;
          height: 44px;
          border-radius: 4px;
          flex-shrink: 0;
        }

        .today-info { flex: 1; }
        .today-info .course-name {
          font-size: 0.95rem;
          font-weight: 700;
          color: var(--text);
          margin-bottom: 3px;
        }
        .today-info .course-sub {
          font-size: 0.8rem;
          color: var(--text-muted);
        }
        .today-time {
          font-size: 0.9rem;
          font-weight: 700;
          color: var(--primary);
          white-space: nowrap;
        }

        .empty-today {
          text-align: center;
          color: var(--text-muted);
          padding: 32px;
          font-size: 0.95rem;
        }

        /* ── Responsive ── */
        @media (max-width: 1100px) {
          .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
          .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
          .stat-value { font-size: 1.3rem; }
          .stat-icon { width: 40px; height: 40px; }
          .next-course-card { padding: 18px; gap: 14px; }
          .next-course-info h3 { font-size: 1rem; }
          .btn-appel { width: 100%; justify-content: center; }
        }

        @media (max-width: 380px) {
          .stats-grid { grid-template-columns: 1fr 1fr; }
          .stat-card { padding: 14px 12px; gap: 10px; }
          .stat-label { font-size: 0.65rem; }
        }

    </style>
</head>
<body>

            <img src="../assets/image.png" alt="ADSIS" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />

    <nav class="sidebar-nav">
        <a href="dashboardens.html" class="nav-item active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>Tableau de bord</span></a>
        <a href="emploiens.html" class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Emploi de temps</span></a>

<div class="main-wrap">
    <header class="topbar">

        <div class="topbar-title">

            </div>

            <div class="section-header">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <h3>Cours du jour</h3>
            </div>
            <div class="today-list" id="today-list"></div>
        </section>
    </main>
</div>
<script>
    /* ===== ADSIS – shared.js ===== */

    // ── Auth guard ────────────────────────────────────────────────────────────────
    function getUser() {
      try { return JSON.parse(localStorage.getItem('adsis_user') || 'null'); }
      catch { return null; }
    }

    (function authGuard() {
      const user = getUser();
      if (!user) { window.location.href = 'login.html'; return; }

      ['user-name-top','user-name-prof'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = user.name || 'Utilisateur';
      });
      ['user-email-top','user-email-prof'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = user.email || '';
      });

      const initials = (user.name || 'U').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
      document.querySelectorAll('.avatar').forEach(el => el.textContent = initials);
      document.querySelectorAll('#sb-etab, .sb-etab').forEach(el => {
        el.textContent = user.etablissement || '';
      });
    })();

    // ── Sidebar toggle ─────────────────────────────────────────────────────────────
    (function initSidebar() {
      const sidebar      = document.getElementById('sidebar');
      const overlay      = document.getElementById('sidebar-overlay');
      const burger       = document.getElementById('burger');
      const sidebarClose = document.getElementById('sidebar-close');

      if (!sidebar) return;

      function openSidebar() {
        sidebar.classList.add('open');
        if (overlay) overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeSidebar() {
        sidebar.classList.remove('open');
        if (overlay) overlay.classList.remove('open');
        document.body.style.overflow = '';
      }

      // Burger click
      if (burger) {
        burger.addEventListener('click', function(e) {
          e.stopPropagation();
          if (sidebar.classList.contains('open')) closeSidebar();
          else openSidebar();
        });
      }

      // Close ✕ button inside sidebar
      if (sidebarClose) {
        sidebarClose.addEventListener('click', closeSidebar);
      }

      // Overlay click
      if (overlay) {
        overlay.addEventListener('click', closeSidebar);
      }

      // Close on Escape
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeSidebar();
      });

      // Close sidebar when navigating (click on nav-item)
      sidebar.querySelectorAll('.nav-item').forEach(function(item) {
        item.addEventListener('click', function() {
          // Only close on mobile
          if (window.innerWidth <= 768) closeSidebar();
        });
      });
    })();

    // ── Logout ────────────────────────────────────────────────────────────────────
    document.getElementById('btn-logout')?.addEventListener('click', function() {
      localStorage.removeItem('adsis_user');

      });

    const dateEl = document.getElementById('page-date');
    if (dateEl) dateEl.textContent = formatDate();

    const DAYS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
    function todayName() { return DAYS[new Date().getDay()]; }

<script>
    /* ===== ADSIS – dashboardens.js ===== */

    const schedule = window.ADSIS_SCHEDULE || [];
    const DAYS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
    const todayName = DAYS[new Date().getDay()];

    // ── Stats ─────────────────────────────────────────────────────────────────────
    const todayCourses = schedule.filter(s => s.day === todayName);
    const weekTotal    = schedule.reduce((acc, s) => {
      const [sh, sm] = s.start.split(':').map(Number);
      const [eh, em] = s.end.split(':').map(Number);
      return acc + ((eh * 60 + em) - (sh * 60 + sm));
    }, 0);

    document.getElementById('stat-cours').textContent    = todayCourses.length;
    document.getElementById('stat-heures').textContent   = Math.round(weekTotal / 60) + 'h';
    document.getElementById('stat-etudiants').textContent = (window.ADSIS_STUDENTS || []).length * 3;

    // ── Find next course ──────────────────────────────────────────────────────────
    function timeToMins(t) {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }

    function findNextCourse() {
      const now = new Date();
      const nowMins = now.getHours() * 60 + now.getMinutes();
      const todayIdx = now.getDay();

      // Search from today onwards in the week
      for (let offset = 0; offset < 7; offset++) {
        const dayIdx = (todayIdx + offset) % 7;
        const dayName = DAYS[dayIdx];
        const dayCourses = schedule.filter(s => s.day === dayName);

        for (const c of dayCourses.sort((a,b) => timeToMins(a.start) - timeToMins(b.start))) {
          if (offset === 0 && timeToMins(c.end) <= nowMins) continue; // already ended today
          return { ...c, isToday: offset === 0, dayLabel: dayName };
        }
      }
      return null;
    }

    // ── Render next course ────────────────────────────────────────────────────────
    const nextSection = document.getElementById('next-course-section');
    const next = findNextCourse();

    if (next) {
      nextSection.innerHTML = `
        <div class="next-course-card">
          <div class="next-course-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
          </div>
          <div class="next-course-info">
            <h3>${next.course}</h3>
            <p style="opacity:.85;font-size:.85rem;">${next.class} • ${next.room}</p>
            <div class="next-course-meta">
              <span class="course-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
                ${next.start} – ${next.end}
              </span>
              <span class="course-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="18" rx="2"/>
                  <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                ${next.dayLabel}
              </span>
            </div>
          </div>
          <a class="btn-appel" href="appel.html?id=${next.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 11l3 3L22 4"/>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            </svg>
            Faire l'appel
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </a>
        </div>
      `;
    } else {
      nextSection.innerHTML = `
        <div class="no-course-card">
          <p>🎉 Aucun cours prévu pour le reste de la semaine.</p>
        </div>
      `;
    }

    // ── Render today's courses ────────────────────────────────────────────────────
    const todayList = document.getElementById('today-list');

    if (todayCourses.length === 0) {
      todayList.innerHTML = `<div class="empty-today">Aucun cours aujourd'hui (${todayName}).</div>`;
    } else {
      todayCourses
        .sort((a,b) => timeToMins(a.start) - timeToMins(b.start))
        .forEach(c => {
          const item = document.createElement('div');
          item.className = 'today-item';
          item.innerHTML = `
            <div class="today-strip" style="background:${c.color};"></div>
            <div class="today-info">
              <div class="course-name">${c.course}</div>
              <div class="course-sub">${c.class} • ${c.room}</div>
            </div>
            <div class="today-time">${c.start} – ${c.end}</div>
          `;
          todayList.appendChild(item);
        });
    }

</script>
