<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
   <link rel="stylesheet" href="style/profil.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>projetarchiweb</title>
  </head>
 
<body>

<div class="d-flex">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo-box">
      <img src="assets/image.png" alt="Logo ADSIS">
      <div>
        <small>ÉTABLISSEMENT</small>
        <strong>Saint Jean Ingénieur</strong>
      </div>
    </div>

    <nav class="menu">
      <a href="#"><i class="bi bi-grid"></i> Tableau de bord</a>
      <a href="#"><i class="bi bi-people"></i> Gestion des utilisateurs</a>
      <a href="#"><i class="bi bi-shield-lock"></i> Gestion des accès</a>
      <a href="#" class="active"><i class="bi bi-person"></i> Mon Profil</a>
    </nav>

    <div class="logout">
      <i class="bi bi-box-arrow-left"></i> Déconnexion
    </div>
  </aside>

  <!-- CONTENU PRINCIPAL -->
  <main class="flex-grow-1 p-4">

    <!-- HEADER -->
    <div class="topbar">
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input type="text" placeholder="Rechercher un utilisateur...">
      </div>

      <div class="admin">
        <i class="bi bi-bell"></i>
        <div class="avatar">A</div>
        <div>
          <strong>Administrateur</strong>
          <small>Admin Principal</small>
        </div>
      </div>
    </div>

    <!-- TITRE -->
    <div class="card-section">
      <h5><i class="bi bi-person-circle"></i> Informations personnelles</h5>
      <p class="text-muted">Mettez à jour vos informations de profil</p>

      <!-- PHOTO -->
      <div class="profile-photo">
        <div class="photo-circle">A</div>
        <div>
          <button class="btn btn-outline-primary btn-sm">Changer la photo</button>
          <button class="btn btn-outline-danger btn-sm">Supprimer</button>
          <small>JPG, PNG ou GIF. Max 2MB</small>
        </div>
      </div>

      <!-- FORMULAIRE -->
      <form>
        <div class="row g-3">
          <div class="col-md-6">
            <label>Nom complet</label>
            <input type="text" class="form-control" value="Administrateur Principal">
          </div>

          <div class="col-md-6">
            <label>Email</label>
            <input type="email" class="form-control" value="admin@school.fr">
          </div>

          <div class="col-md-6">
            <label>Téléphone</label>
            <input type="text" class="form-control" value="+33 6 12 34 56 78">
          </div>

          <div class="col-md-6">
            <label>Adresse</label>
            <input type="text" class="form-control" value="123 Rue de l'École, Paris">
          </div>

          <div class="col-12">
            <label>Biographie</label>
            <textarea class="form-control" rows="3">Administrateur principal du système ADSIS</textarea>
          </div>
        </div>
      </form>
    </div>

    <!-- MOT DE PASSE -->
    <div class="card-section mt-4">
      <h5>Modifier le mot de passe</h5>

      <div class="row g-3">
        <div class="col-md-4">
          <label>Mot de passe actuel</label>
          <input type="password" class="form-control" value="********">
        </div>

        <div class="col-md-4">
          <label>Nouveau mot de passe</label>
          <input type="password" class="form-control">
        </div>

        <div class="col-md-4">
          <label>Confirmer le mot de passe</label>
          <input type="password" class="form-control">
        </div>
      </div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
