<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style/profil.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADSIS - Profil</title>
  </head>
 
<body>

<div class="d-flex">

  <aside class="sidebar">
    <div class="logo-box">
      <img src="assets/image.png" alt="Logo ADSIS">
      <div>
        <small>ÉTABLISSEMENT</small>
        <strong>Saint Jean Ingénieur</strong>
      </div>
    </div>

    <nav class="menu">
      <a href="tableaudebord.html"><i class="bi bi-grid"></i> Tableau de bord</a>
      <a href="gestionutilisateur.html"><i class="bi bi-people"></i> Gestion des utilisateurs</a>
      <a href="gestionacces.html"><i class="bi bi-shield-lock"></i> Gestion des accès</a>
      <a href="profil.html" class="active"><i class="bi bi-person"></i> Mon Profil</a>
    </nav>

    <div class="logout">
      <i class="bi bi-box-arrow-left"></i> Déconnexion
    </div>
  </aside>

  <main class="flex-grow-1 p-4">

    <div class="topbar">
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input type="text" placeholder="Rechercher un utilisateur...">
      </div>

      <div class="admin">
        <i class="bi bi-bell"></i>
        <div class="avatar">A</div>
        <div>
          <strong>Administrateur</strong>
          <small>Admin Principal</small>
        </div>
      </div>
    </div>

    <div class="card-section">
      <h5><i class="bi bi-person-circle"></i> Informations personnelles</h5>
      <p class="text-muted">Mettez à jour vos informations de profil</p>

      <div class="profile-photo">
        <div class="photo-circle" id="profileDisplay" style="overflow: hidden; display: flex; align-items: center; justify-content: center; background: #0d6efd; color: white; font-size: 2rem; font-weight: bold;">A</div>
        <div>
          <input type="file" id="photoInput" style="display: none;" accept="image/*" onchange="previewImage(this)">
          
          <button class="btn btn-outline-primary btn-sm" onclick="document.getElementById('photoInput').click()">Changer la photo</button>
          <button class="btn btn-outline-danger btn-sm" onclick="removePhoto()">Supprimer</button>
          <small class="d-block mt-1">JPG, PNG ou GIF. Max 2MB</small>
        </div>
      </div>

      <form class="mt-4">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nom complet</label>
            <input type="text" class="form-control" value="Administrateur Principal">
          </div>

          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" value="admin@school.fr">
          </div>

          <div class="col-md-6">
            <label class="form-label">Téléphone</label>
            <input type="text" class="form-control" value="+33 6 12 34 56 78">
          </div>

          <div class="col-md-6">
            <label class="form-label">Adresse</label>
            <input type="text" class="form-control" value="123 Rue de l'École, Paris">
          </div>

          <div class="col-12">
            <label class="form-label">Biographie</label>
            <textarea class="form-control" rows="3">Administrateur principal du système ADSIS</textarea>
          </div>
        </div>
      </form>
    </div>

    <div class="card-section mt-4">
      <h5>Modifier le mot de passe</h5>

      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Mot de passe actuel</label>
          <input type="password" class="form-control" value="********">
        </div>

        <div class="col-md-4">
          <label class="form-label">Nouveau mot de passe</label>
          <input type="password" class="form-control">
        </div>

        <div class="col-md-4">
          <label class="form-label">Confirmer le mot de passe</label>
          <input type="password" class="form-control">
        </div>
      </div>
      <div class="mt-3">
        <button class="btn btn-primary">Enregistrer les modifications</button>
      </div>
    </div>

  </main>
</div>

<script>
  // Fonction pour afficher l'aperçu de l'image sélectionnée
  function previewImage(input) {
    const display = document.getElementById('profileDisplay');
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        display.innerHTML = `<img src="${e.target.result}" style="width: 100%; height: 100%; object-fit: cover;">`;
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  // Fonction pour supprimer la photo et remettre l'initiale
  function removePhoto() {
    const display = document.getElementById('profileDisplay');
    const input = document.getElementById('photoInput');
    display.innerHTML = "A"; 
    input.value = ""; // Réinitialise l'explorateur de fichiers
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
