<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADSIS - Gestion des matières</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../style/matiere.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- SIDEBAR -->
            <div class="col-lg-2 col-md-3 col-sm-12 p-0 sidebar">
                <div class="sidebar-brand">
                    <div class="logo-box mb-4 pb-3 border-bottom">
                        <img src="../assets/image.png" alt="Logo ADSIS" class="logo" onerror="this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%234e73df%22%2F%3E%3Ctext%20x%3D%2250%22%20y%3D%2265%22%20font-size%3D%2250%22%20text-anchor%3D%22middle%22%20fill%3D%22white%22%20font-family%3D%22Arial%22%3EADSIS%3C%2Ftext%3E%3C%2Fsvg%3E'">
                        <h5 class="brand-name m-0 ms-2">ADSIS</h5>
                    </div>
                </div>
                <nav class="nav flex-column gap-2">
                    <a class="nav-link" href="tableaudebordass.html"><i class="bi bi-grid"></i>Tableau de bord</a>
                    <a class="nav-link active" href="matiere.html"><i class="bi bi-book"></i>Matiere</a>
                    <a class="nav-link" href="emploidutemps.html"><i class="bi bi-calendar3"></i>Emploi du temps</a>
                </nav>
                <hr class="mx-3 d-none d-md-block">
                <div class="admin-profile mx-3 mt-4 d-none d-md-flex">
                    <i class="fas fa-user"></i>Assistant pedagogique
                </div>
            </div>

            <!-- CONTENU PRINCIPAL -->
            <div class="col-lg-10 col-md-9 col-sm-12 p-3 p-md-4 main-content">
                <!-- En-tête -->
                <div class="main-header d-flex flex-wrap align-items-center justify-content-between gap-2">
                    <h5 class="mb-0 fw-semibold header-title">Gestion des matières</h5>
                    <button class="btn btn-primary rounded-3 px-4 shadow-sm" id="openCreateModalBtn">
                        <i class="bi bi-plus-lg me-2"></i>Nouvelle matière
                    </button>
                </div>

                <!-- Liste des matières -->
                <div class="card-timetable mt-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-semibold mb-0"><i class="fas fa-list me-2"></i>Matières</h5>
                    </div>
                    <div id="matieresContainer" class="matieres-list">
                        <!-- Les matières seront injectées ici par JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Création / Modification de Matière -->
    <div class="modal fade" id="matiereModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h6 class="modal-title fw-bold" id="matiereModalTitle"><i class="bi bi-book me-2"></i>Nouvelle matière</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editMatiereId" value="">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Code UE</label>
                        <input type="text" class="form-control" id="codeInput" placeholder="Ex: MATH, INFO...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Intitulé</label>
                        <input type="text" class="form-control" id="nomInput" placeholder="Intitulé de la matière">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Spécialité</label>
                        <select class="form-select" id="specialiteSelect">
                            <option value="">-- Sélectionner --</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-primary" id="saveMatiereBtn">Enregistrer</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Assignation Enseignants -->
    <div class="modal fade" id="enseignantModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-info text-white">
                    <h6 class="modal-title fw-bold" id="enseignantModalTitle"><i class="bi bi-people me-2"></i>Assigner des enseignants</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="enseignantMatiereId" value="">
                    <!-- Barre de recherche et filtre -->
                    <div class="row g-2 mb-3">
                        <div class="col-md-8">
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control" id="enseignantSearch" placeholder="Rechercher par nom ou prénom...">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <select class="form-select" id="enseignantFilterSpecialite">
                                <option value="">Toutes spécialités</option>
                            </select>
                        </div>
                    </div>
                    <!-- Liste des enseignants avec checkboxes -->
                    <div id="enseignantListContainer" style="max-height: 400px; overflow-y: auto;">
                        <p class="text-muted text-center">Chargement...</p>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-info text-white" id="saveEnseignantsBtn">Enregistrer</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999;"></div>

    <!-- Confirm Modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h6 class="modal-title fw-bold" id="confirmModalTitle">Confirmer</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body pt-2">
                    <p class="mb-0 text-muted" id="confirmModalMessage">Êtes-vous sûr ?</p>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-sm btn-light" id="confirmCancelBtn">Annuler</button>
                    <button type="button" class="btn btn-sm btn-danger" id="confirmOkBtn">Confirmer</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script/matiere.js"></script>
</body>
</html>
