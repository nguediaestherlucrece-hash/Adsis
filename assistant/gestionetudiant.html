<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>ADSIS - Gestion des étudiants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../style/gestionetudiant.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- SIDEBAR -->
            <div class="col-lg-2 col-md-3 col-sm-12 p-0 sidebar">
                <div class="sidebar-brand">
                    <div class="logo-box mb-4 pb-3 border-bottom">
                        <img src="../assets/image.png" alt="Logo ADSIS" class="logo" onerror="this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%234e73df%22%2F%3E%3Ctext%20x%3D%2250%22%20y%3D%2265%22%20font-size%3D%2250%22%20text-anchor%3D%22middle%22%20fill%3D%22white%22%20font-family%3D%22Arial%22%3EADSIS%3C%2Ftext%3E%3C%2Fsvg%3E'">
                        <h5 class="brand-name m-0 ms-2">ADSIS</h5>
                    </div>
                </div>
                <nav class="nav flex-column gap-2">
                    <a class="nav-link" href="tableaudebordass.html"><i class="bi bi-grid"></i>Tableau de bord</a>
                    <a class="nav-link" href="matiere.html"><i class="bi bi-book"></i>Matiere</a>
                    <a class="nav-link active" href="gestionetudiant.html"><i class="bi bi-person-badge"></i>Étudiants</a>
                    <a class="nav-link" href="emploidutemps.html"><i class="bi bi-calendar3"></i>Emploi du temps</a>
                </nav>
                <hr class="mx-3 d-none d-md-block">
                <div class="admin-profile mx-3 mt-4 d-none d-md-flex">
                    <i class="fas fa-user"></i> Assistant pedagogique
                </div>
            </div>

            <!-- CONTENU PRINCIPAL -->
            <div class="col-lg-10 col-md-9 col-sm-12 p-3 p-md-4 main-content">
                <div class="main-header">
                    <h5 class="mb-0 fw-semibold header-title">Gestion des étudiants</h5>
                </div>

                <!-- Formulaire d'ajout -->
                <div class="card-course-add mb-4">
                    <h6 class="fw-semibold mb-3"><i class="fas fa-user-plus me-2"></i>Ajouter un étudiant</h6>
                    <div class="row g-2">
                        <div class="col-md-3 col-sm-6">
                            <input type="text" class="form-control" id="prenomInput" placeholder="Prénom">
                        </div>
                        <div class="col-md-3 col-sm-6">
                            <input type="text" class="form-control" id="nomInput" placeholder="Nom">
                        </div>
                        <div class="col-md-4 col-sm-8">
                            <select class="form-select" id="classeSelect">
                                <!-- Options générées dynamiquement -->
                            </select>
                        </div>
                        <div class="col-md-2 col-sm-4">
                            <button class="btn btn-primary w-100" id="ajouterBtn">Ajouter</button>
                        </div>
                    </div>
                </div>

                <!-- Filtre et export -->
                <div class="card-timetable mt-3">
                    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                        <div class="d-flex gap-2 align-items-center">
                            <label class="fw-semibold">Classe :</label>
                            <select id="filtreClasse" class="form-select form-select-sm w-auto">
                                <option value="all">Toutes les classes</option>
                                <!-- Options générées dynamiquement -->
                            </select>
                        </div>
                        <button class="btn-export-pdf" id="exportPdfBtn">
                            <i class="fas fa-file-pdf me-2"></i>Exporter PDF
                        </button>
                    </div>

                    <!-- Liste des étudiants -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-semibold mb-0"><i class="fas fa-user-graduate me-2"></i>Étudiants</h5>
                        <span class="badge bg-secondary" id="totalEtudiants">0</span>
                    </div>
                    <div id="studentsList" class="matieres-list">
                        <!-- Rempli par JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script/gestionetudiant.js"></script>
</body>
</html>
