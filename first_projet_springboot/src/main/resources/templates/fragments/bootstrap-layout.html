<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ═══ HEAD BOOTSTRAP — admin / assistant / profil partagé ═══ -->
<head th:fragment="head(pageTitle, pageCss)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="'ADSIS - ' + ${pageTitle}">ADSIS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/sidebar.css?v=2.0}"/>
  <link rel="stylesheet" th:if="${pageCss}" th:href="@{'/css/' + ${pageCss} + '?v=2.0'}"/>
  <link rel="manifest" href="/manifest.json"/>
</head>

<!-- ═══ HEAD ÉTUDIANT — charge etudiant-shared.css + CSS de page ═══ -->
<head th:fragment="head-etudiant(pageTitle, pageCss)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="'ADSIS - ' + ${pageTitle}">ADSIS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/sidebar.css?v=2.0}"/>
  <link rel="stylesheet" th:href="@{/css/etudiant-shared.css?v=2.0}"/>
  <link rel="stylesheet" th:if="${pageCss}" th:href="@{'/css/' + ${pageCss} + '?v=2.0'}"/>
  <link rel="manifest" href="/manifest.json"/>
</head>

<!-- ═══ TOPBAR ADMIN ═══ -->
<div th:fragment="topbar-admin(pageTitle)" class="topbar mb-4">
  <button class="burger" id="burger" aria-label="Ouvrir le menu"><span></span><span></span><span></span></button>
  <div>
    <h4 class="fw-bold mb-0" th:text="${pageTitle}">Page</h4>
    <p class="text-muted small m-0" id="dashboardDate"></p>
  </div>
  <div class="d-flex align-items-center gap-3">
    <div class="text-end d-none d-sm-block">
      <div class="fw-bold small" id="user-name-top">Administrateur</div>
      <div class="text-muted" style="font-size:.7rem;" id="user-email-top">admin@adsis.com</div>
    </div>
    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold shadow-sm"
         style="width:38px;height:38px;" id="user-avatar">A</div>
  </div>
</div>

<!-- ═══ TOPBAR ÉTUDIANT — avatar bleu cohérent avec le reste de l'app ═══ -->
<div th:fragment="topbar-etudiant(pageTitle)" class="topbar mb-4">
  <button class="burger" id="burger" aria-label="Ouvrir le menu"><span></span><span></span><span></span></button>
  <div>
    <h4 class="fw-bold mb-0" th:text="${pageTitle}">Page</h4>
    <p class="text-muted small m-0" id="dashboardDate"></p>
  </div>
  <div class="d-flex align-items-center gap-3">
    <div class="text-end d-none d-sm-block">
      <div class="fw-bold small" id="user-name-top">Étudiant</div>
      <div class="text-muted" style="font-size:.7rem;" id="user-email-top"></div>
    </div>
    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold shadow-sm"
         style="width:38px;height:38px;" id="user-avatar">E</div>
  </div>
</div>

</html>
