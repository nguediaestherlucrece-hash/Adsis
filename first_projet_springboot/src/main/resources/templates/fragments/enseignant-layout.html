<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ═══ FRAGMENT HEAD ═══ -->
<head th:fragment="head(pageTitle, pageCss)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="'ADSIS – ' + ${pageTitle}">ADSIS</title>
  <meta name="theme-color" content="#3B55E6"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/shared-ens.css}"/>
  <link rel="stylesheet" th:if="${pageCss}" th:href="@{'/css/' + ${pageCss}}"/>
  <link rel="stylesheet" th:href="@{/css/sidebar.css}"/>
</head>



<!-- ═══ FRAGMENT TOPBAR ═══ -->
<header th:fragment="topbar(pageTitle)" class="topbar">
  <button class="burger" id="burger" aria-label="Ouvrir le menu">
    <span></span><span></span><span></span>
  </button>
  <div class="topbar-title">
    <h2 th:text="${pageTitle}">Page</h2>
    <p id="page-date" class="topbar-date"></p>
  </div>
  <div class="topbar-user">
    <div class="user-info">
      <span id="user-name-top" class="user-name"></span>
      <span id="user-email-top" class="user-email"></span>
    </div>
    <div class="avatar" id="user-avatar"></div>
  </div>
</header>

</html>
