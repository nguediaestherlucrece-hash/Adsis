<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/enseignant-layout :: head('Connexion', 'login.css')}"></head>

<body>
<div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<main class="login-wrapper">
    <div class="login-card">
        <div class="logo-wrap">
            <img src="/assets/image.png" alt="ADSIS Logo" class="logo-img" onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='flex';" />
            <div class="logo-fallback" style="display:none;">
                <span class="logo-icon">✔</span>
            </div>
        </div>

        <h1 class="brand-name">ADSIS</h1>
        <p class="brand-sub">Système de gestion académique</p>

        <div id="alert-box" class="alert-box" role="alert" aria-live="polite"></div>

        <div class="field-group">
            <label for="email">Adresse e-mail</label>
            <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,12 2,6"/></svg>
                <input type="email" id="email" placeholder="exemple@adsis.com" autocomplete="username" />
            </div>
        </div>

        <div class="field-group">
            <label for="password">Mot de passe</label>
            <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
                <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Afficher/masquer le mot de passe">
                    <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
        </div>

        <button class="btn-login" id="btn-login">
            <span id="btn-text">Se connecter</span>
            <span id="btn-spinner" class="spinner" aria-hidden="true" style="display:none;"></span>
        </button>

        <a href="#" class="forgot-link">Mot de passe oublié ?</a>
    </div>
</main>

<script type="module" th:src="@{/js/login.js}"></script>
</body>
</html>
