<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/enseignant-layout :: head('Mon profil', 'profilens.css')}"></head>

<body>
  <div class="container-fluid">
    <div class="row min-vh-100">
      <aside th:replace="~{fragments/sidebar :: sidebar(activePage='profil', role='SHARED')}"></aside>

      <div class="col-md-9 col-lg-10 p-4">
        <header th:replace="~{fragments/enseignant-layout :: topbar('Mon profil')}"></header>

        <!-- HERO -->
        <div class="profile-hero">
          <div class="profile-avatar-wrap"><div class="profile-avatar" id="prof-avatar">—</div></div>
          <div class="profile-hero-info">
            <h2 id="prof-name">—</h2>
            <p id="prof-role-label" style="font-size:0.72rem;font-weight:700;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;"></p>
            <span id="role-badge-container"></span>
          </div>
        </div>

        <!-- Informations personnelles -->
        <div class="profile-section">
          <div class="section-heading">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Informations personnelles
          </div>
          <div class="form-grid">
            <div class="form-field"><label for="f-prenom">Prénom</label><input type="text" id="f-prenom" placeholder="Prénom"/></div>
            <div class="form-field"><label for="f-nom">Nom</label><input type="text" id="f-nom" placeholder="Nom"/></div>
            <div class="form-field form-field-full"><label for="f-email">Email</label><input type="email" id="f-email" placeholder="email@adsis.com"/></div>
            <div class="form-field"><label for="f-tel">Téléphone</label><input type="tel" id="f-tel" placeholder="+221 77 000 00 00"/></div>
            <div class="form-field"><label for="f-adresse">Adresse</label><input type="text" id="f-adresse" placeholder="Ville, Pays"/></div>
            <div class="form-field form-field-full"><label for="f-etab">Établissement</label><input type="text" id="f-etab" value="Saint Jean Ingénieur" disabled/></div>
          </div>
          <div class="form-actions">
            <button class="btn-save" id="btn-save">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              Enregistrer les modifications
            </button>
          </div>
          <div class="save-feedback" id="save-feedback"></div>
        </div>

        <!-- Sécurité -->
        <div class="profile-section">
          <div class="section-heading">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Sécurité — Changer le mot de passe
          </div>
          <div class="form-grid">
            <div class="form-field form-field-full"><label for="f-pw-cur">Mot de passe actuel</label><input type="password" id="f-pw-cur" placeholder="••••••••"/></div>
            <div class="form-field"><label for="f-pw-new">Nouveau mot de passe</label><input type="password" id="f-pw-new" placeholder="••••••••"/></div>
            <div class="form-field"><label for="f-pw-conf">Confirmer</label><input type="password" id="f-pw-conf" placeholder="••••••••"/></div>
          </div>
          <div class="form-actions">
            <button class="btn-save btn-secondary" id="btn-change-pw">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              Changer le mot de passe
            </button>
          </div>
          <div class="save-feedback" id="pw-feedback"></div>
        </div>

        <!-- Déconnexion -->
        <div class="logout-section">
          <div class="logout-info"><h3>Se déconnecter</h3><p>Terminer votre session en cours sur cet appareil.</p></div>
          <button class="btn-logout" id="btn-logout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Se déconnecter
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- MODAL DE CONFIRMATION -->
  <div class="modal-overlay" id="logout-modal">
    <div class="modal-box">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" width="28" height="28"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </div>
      <h3>Confirmer la déconnexion</h3>
      <p>Êtes-vous sûr de vouloir vous déconnecter ? Votre session sera terminée.</p>
      <div class="modal-actions">
        <button class="btn-modal-cancel" id="logout-cancel">Annuler</button>
        <button class="btn-modal-confirm" id="logout-confirm">Se déconnecter</button>
      </div>
    </div>
  </div>

  <script type="module" th:src="@{/js/shared.js}"></script>
  <script type="module" th:src="@{/js/profile-unified.js}"></script>
</body>
</html>
