<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/bootstrap-layout :: head('Gestion des accès', 'tableaudebord.css')}"></head>

<body>
    <style>
        body { background-color: #f8f9fa; }
        .role-card { background:white; border:1px solid #dee2e6; border-radius:10px; padding:15px; cursor:pointer; transition:0.2s; }
        .role-card:hover { border-color:#0d6efd; background:#f0f7ff; }
        .role-card.active { border-color:#0d6efd; background:#e7f1ff; box-shadow:0 4px 10px rgba(13,110,253,0.1); }
        .perm-group-title { background:#f8f9fa; padding:10px 15px; font-weight:bold; font-size:0.9rem; border-radius:8px; margin-top:20px; color:#495057; }
        .perm-item { display:flex; align-items:center; justify-content:space-between; padding:12px 15px; border-bottom:1px solid #f1f1f1; }
        .perm-item:last-child { border-bottom:none; }
    </style>
    <div class="container-fluid">
        <div class="row min-vh-100">
            <aside th:replace="~{fragments/sidebar :: sidebar(activePage='acces', role='ADMIN')}"></aside>

            <main class="col-md-9 col-lg-10 p-4">
                <div th:replace="~{fragments/bootstrap-layout :: topbar-admin('Gestion des accès')}"></div>
                <div class="mb-4"><h4 class="fw-bold m-0">Gestion des accès</h4></div>
                <div class="p-4 bg-light text-end"><button class="btn btn-primary px-5">Sauvegarder</button></div>
                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="d-flex flex-column gap-3" id="roleListContainer">
                            <div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="card p-0 shadow-sm border-0 overflow-hidden">
                            <div class="p-4 border-bottom bg-white d-flex justify-content-between align-items-center">
                                <h5 class="m-0">Permissions : <span id="role-badge" class="badge bg-primary">Enseignant</span></h5>
                                <span class="text-muted small" id="count-text">0 / 10 activées</span>
                            </div>
                            <div class="p-3" id="permissionsContainer"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" th:src="@{/js/access.js}"></script>
</body>
</html>
