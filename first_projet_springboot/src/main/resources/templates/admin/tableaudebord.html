<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/bootstrap-layout :: head('Tableau de bord', 'tableaudebord.css')}"></head>

<body>
    <div class="container-fluid">
        <div class="row min-vh-100">
            <!-- Sidebar fragment -->
            <aside th:replace="~{fragments/sidebar :: sidebar(activePage='tableaudebord', role='ADMIN')}"></aside>

            <main class="col-md-9 col-lg-10 p-4">
                <div th:replace="~{fragments/bootstrap-layout :: topbar-admin('Tableau de bord')}"></div>

                <!-- Date du jour -->
                <p class="text-muted small mb-4" id="dashboardDate"></p>

                <!-- ═══ KPI Cards ═══ -->
                <div class="row g-3 mb-4">
                    <div class="col-6 col-lg-3">
                        <div class="stat-card-new">
                            <div class="stat-icon blue"><i class="bi bi-people-fill"></i></div>
                            <div class="stat-value" id="kpi-staff">0</div>
                            <div class="stat-label">Personnel total</div>
                        </div>
                    </div>
                    <div class="col-6 col-lg-3">
                        <div class="stat-card-new">
                            <div class="stat-icon green"><i class="bi bi-person-workspace"></i></div>
                            <div class="stat-value" id="kpi-enseign">0</div>
                            <div class="stat-label">Enseignants</div>
                        </div>
                    </div>
                    <div class="col-6 col-lg-3">
                        <div class="stat-card-new">
                            <div class="stat-icon orange"><i class="bi bi-shield-fill-check"></i></div>
                            <div class="stat-value" id="kpi-surveil">0</div>
                            <div class="stat-label">Surveillants</div>
                        </div>
                    </div>
                    <div class="col-6 col-lg-3">
                        <div class="stat-card-new">
                            <div class="stat-icon purple"><i class="bi bi-person-badge-fill"></i></div>
                            <div class="stat-value" id="kpi-ap">0</div>
                            <div class="stat-label">Assistants péd.</div>
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-6 col-lg-4">
                        <div class="stat-card-new">
                            <div class="stat-icon teal"><i class="bi bi-diagram-3-fill"></i></div>
                            <div class="stat-value" id="kpi-cycles">0</div>
                            <div class="stat-label">Cycles</div>
                        </div>
                    </div>
                    <div class="col-6 col-lg-4">
                        <div class="stat-card-new">
                            <div class="stat-icon pink"><i class="bi bi-bookmark-fill"></i></div>
                            <div class="stat-value" id="kpi-filieres">0</div>
                            <div class="stat-label">Filières</div>
                        </div>
                    </div>
                    <div class="col-6 col-lg-4">
                        <div class="stat-card-new">
                            <div class="stat-icon indigo"><i class="bi bi-mortarboard-fill"></i></div>
                            <div class="stat-value" id="kpi-classes">0</div>
                            <div class="stat-label">Classes</div>
                        </div>
                    </div>
                </div>

                <!-- ═══ Staff Health ═══ -->
                <div class="row g-4 mb-4">
                    <div class="col-lg-5">
                        <div class="card shadow-sm border-0 rounded-4 p-4">
                            <h6 class="fw-bold mb-3"><i class="bi bi-heart-pulse me-2 text-danger"></i>Santé du personnel</h6>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="small text-muted">Actifs <strong id="label-actif">0</strong></span>
                                <span class="small text-muted">Bloqués <strong id="label-bloque">0</strong></span>
                            </div>
                            <div class="progress mb-3" style="height:8px;border-radius:8px;">
                                <div class="progress-bar bg-success" id="bar-actif" style="width:0%;transition:width .6s ease;"></div>
                                <div class="progress-bar bg-danger" id="bar-bloque" style="width:0%;transition:width .6s ease;"></div>
                            </div>
                            <div class="d-flex justify-content-around text-center mt-3">
                                <div>
                                    <div class="fw-bold fs-5 text-primary" id="big-enseign">0</div>
                                    <div class="text-muted" style="font-size:.72rem;">Enseignants</div>
                                </div>
                                <div>
                                    <div class="fw-bold fs-5 text-warning" id="big-surveil">0</div>
                                    <div class="text-muted" style="font-size:.72rem;">Surveillants</div>
                                </div>
                                <div>
                                    <div class="fw-bold fs-5 text-success" id="big-ap">0</div>
                                    <div class="text-muted" style="font-size:.72rem;">Assistants</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ═══ Cycles List ═══ -->
                    <div class="col-lg-7">
                        <div class="card shadow-sm border-0 rounded-4 p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h6 class="fw-bold mb-0"><i class="bi bi-diagram-3 me-2" style="color:#6366f1;"></i>Cycles</h6>
                                <a href="/admin/cycles" class="btn btn-sm btn-outline-primary rounded-3">Tout voir</a>
                            </div>
                            <div id="cyclesList"></div>
                        </div>
                    </div>
                </div>

                <!-- ═══ Staff List + Classes List ═══ -->
                <div class="row g-4">
                    <div class="col-lg-6">
                        <div class="card shadow-sm border-0 rounded-4 p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h6 class="fw-bold mb-0"><i class="bi bi-people me-2 text-primary"></i>Personnel récent</h6>
                                <a href="/admin/gestionutilisateur" class="btn btn-sm btn-outline-primary rounded-3">Tout voir</a>
                            </div>
                            <div id="staffList"></div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="card shadow-sm border-0 rounded-4 p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h6 class="fw-bold mb-0"><i class="bi bi-mortarboard me-2" style="color:#3b82f6;"></i>Classes</h6>
                                <a href="/admin/cycles" class="btn btn-sm btn-outline-primary rounded-3">Tout voir</a>
                            </div>
                            <div id="classesList"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" th:src="@{/js/dashboard.js}"></script>
</body>
</html>
