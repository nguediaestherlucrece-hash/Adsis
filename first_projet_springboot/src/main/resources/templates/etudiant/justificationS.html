<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/bootstrap-layout :: head-etudiant('Justifier une absence', 'justifications.css')}"></head>

<body>
    <div class="container-fluid">
        <div class="row min-vh-100">
            <aside th:replace="~{fragments/sidebar :: sidebar(activePage='justifications', role='ETUDIANT')}"></aside>

            <div class="col-md-9 col-lg-10 p-0 d-flex flex-column main-content">
                <div class="topbar mb-4" th:replace="~{fragments/bootstrap-layout :: topbar-etudiant('Justifier une absence')}"></div>

                <div class="content p-3 p-md-4">
                    <div class="row g-4">
                        <!-- Formulaire de soumission -->
                        <div class="col-lg-6">
                            <div class="card border-0 shadow-sm">
                                <div class="card-header bg-primary text-white">
                                    <i class="bi bi-file-earmark-plus me-2"></i>Nouvelle justification
                                </div>
                                <div class="card-body">
                                    <form id="justification-form" novalidate>
                                        <div class="mb-3">
                                            <label for="absence-select" class="form-label fw-semibold">
                                                Absence à justifier <span class="text-danger">*</span>
                                            </label>
                                            <select id="absence-select" class="form-select" required>
                                                <option value="">Chargement…</option>
                                            </select>
                                        </div>
                                        <div class="mb-3">
                                            <label for="motif" class="form-label fw-semibold">
                                                Motif <span class="text-danger">*</span>
                                            </label>
                                            <textarea id="motif" class="form-control" rows="4"
                                                      placeholder="Décrivez la raison de votre absence…" required></textarea>
                                        </div>
                                        <div class="mb-3">
                                            <label for="piece-jointe" class="form-label fw-semibold">
                                                Pièce justificative (optionnel)
                                            </label>
                                            <input type="file" id="piece-jointe" class="form-control"
                                                   accept=".pdf,.jpg,.jpeg,.png"/>
                                            <div class="form-text">PDF, JPG ou PNG — max 5 Mo</div>
                                        </div>
                                        <button type="submit" class="btn btn-primary w-100" id="btn-submit">
                                            <i class="bi bi-send me-2"></i>Envoyer la justification
                                        </button>
                                    </form>
                                    <div id="form-message" class="mt-3"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Historique des justificatifs -->
                        <div class="col-lg-6">
                            <div class="card border-0 shadow-sm">
                                <div class="card-header">
                                    <i class="bi bi-clock-history me-2"></i>Mes justificatifs soumis
                                </div>
                                <div class="card-body p-0">
                                    <ul class="list-group list-group-flush" id="historique-list">
                                        <li class="list-group-item text-muted text-center py-3">Chargement…</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" th:src="@{/js/justifications.js}"></script>
    <script th:src="@{/js/pwa.js}"></script>
</body>
</html>
