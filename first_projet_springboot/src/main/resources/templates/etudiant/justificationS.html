<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/bootstrap-layout :: head('Justifier une absence', 'justifications.css')}"></head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div th:replace="~{fragments/bootstrap-layout :: sidebar-etudiant('justifications')}"></div>

            <div class="col-lg-10 col-md-9 col-sm-12 p-3 p-md-4 main-content">
                <h5>Formulaire de justification</h5>
                <form id="justification-form" class="mt-4">
                    <div class="mb-3">
                        <label for="absence-select" class="form-label">Sélectionnez une absence</label>
                        <select id="absence-select" class="form-select" required></select>
                    </div>
                    <div class="mb-3">
                        <label for="motif" class="form-label">Motif</label>
                        <textarea id="motif" class="form-control" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Envoyer la justification</button>
                </form>
                <div id="message" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" th:src="@{/js/justifications.js}"></script>
</body>
</html>
