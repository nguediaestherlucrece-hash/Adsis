<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/bootstrap-layout :: head('Mon emploi du temps', emploietu.css')}"></head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div th:replace="~{fragments/bootstrap-layout :: sidebar-etudiant('emploi')}"></div>

            <div class="col-lg-10 col-md-9 col-sm-12 p-3 p-md-4 main-content">
                <h5>Emploi du temps</h5>
                <div id="calendrier" class="mt-3">
                    <table class="table table-bordered" id="edt-table">
                        <thead class="table-dark">
                            <tr><th>Heure</th><th>Lundi</th><th>Mardi</th><th>Mercredi</th><th>Jeudi</th><th>Vendredi</th></tr>
                        </thead>
                        <tbody id="edt-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" th:src="@{/js/emploietu.js}"></script>
</body>
</html>
