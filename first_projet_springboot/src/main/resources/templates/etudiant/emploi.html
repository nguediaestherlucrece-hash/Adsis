<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/bootstrap-layout :: head-etudiant('Mon emploi du temps', 'emploietu.css')}"></head>

<body>
    <div class="container-fluid">
        <div class="row min-vh-100">
            <aside th:replace="~{fragments/sidebar :: sidebar(activePage='emploi', role='ETUDIANT')}"></aside>

            <div class="col-md-9 col-lg-10 p-0 d-flex flex-column main-content">
                <div class="topbar mb-4" th:replace="~{fragments/bootstrap-layout :: topbar-etudiant('Emploi du temps')}"></div>

                <div class="content p-3 p-md-4">
                    <!-- Navigation semaine -->
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <button id="btn-prev-week" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-chevron-left"></i> Semaine préc.
                        </button>
                        <span id="week-label" class="fw-bold text-center"></span>
                        <button id="btn-next-week" class="btn btn-outline-secondary btn-sm">
                            Semaine suiv. <i class="bi bi-chevron-right"></i>
                        </button>
                    </div>

                    <!-- Indicateur hors-ligne -->
                    <div id="offline-edt-notice" class="alert alert-warning d-none" role="alert">
                        <i class="bi bi-wifi-off me-2"></i>Données en cache — connexion hors ligne
                    </div>

                    <!-- Tableau emploi du temps -->
                    <div id="calendrier" class="mt-2">
                        <div class="table-responsive">
                            <table class="table table-bordered table-hover" id="edt-table">
                                <thead class="table-dark">
                                    <tr>
                                        <th style="width:60px">Heure</th>
                                        <th>Lundi</th>
                                        <th>Mardi</th>
                                        <th>Mercredi</th>
                                        <th>Jeudi</th>
                                        <th>Vendredi</th>
                                        <th>Samedi</th>
                                    </tr>
                                </thead>
                                <tbody id="edt-body">
                                    <tr><td colspan="7" class="text-center py-4">
                                        <div class="spinner-border spinner-border-sm text-primary me-2"></div>Chargement…
                                    </td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" th:src="@{/js/emploietu.js}"></script>
    <script th:src="@{/js/pwa.js}"></script>
</body>
</html>
