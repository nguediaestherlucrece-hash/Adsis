<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/bootstrap-layout :: head-etudiant('Mes absences', 'absences.css')}"></head>

<body>
    <div class="container-fluid">
        <div class="row min-vh-100">
            <aside th:replace="~{fragments/sidebar :: sidebar(activePage='absences', role='ETUDIANT')}"></aside>

            <div class="col-md-9 col-lg-10 p-0 d-flex flex-column main-content">
                <div class="topbar mb-4" th:replace="~{fragments/bootstrap-layout :: topbar-etudiant('Mes absences')}"></div>

                <div class="content p-3 p-md-4">
                    <!-- Compteurs -->
                    <div class="row g-3 mb-4" id="absences-stats">
                        <div class="col-sm-4">
                            <div class="card text-center border-0 shadow-sm">
                                <div class="card-body">
                                    <h3 class="text-danger fw-bold" id="cnt-total">—</h3>
                                    <small class="text-muted">Total absences</small>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="card text-center border-0 shadow-sm">
                                <div class="card-body">
                                    <h3 class="text-warning fw-bold" id="cnt-injustifiees">—</h3>
                                    <small class="text-muted">Non justifiées</small>
                                </div>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="card text-center border-0 shadow-sm">
                                <div class="card-body">
                                    <h3 class="text-success fw-bold" id="cnt-justifiees">—</h3>
                                    <small class="text-muted">Justifiées</small>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Tableau absences -->
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="fw-bold mb-0">Relevé d'absences</h6>
                        <a href="/etudiant/justifications" class="btn btn-sm btn-primary">
                            <i class="bi bi-file-earmark-plus me-1"></i>Justifier une absence
                        </a>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-striped table-hover mt-2" id="absences-table">
                            <thead class="table-dark">
                                <tr>
                                    <th>Date</th>
                                    <th>Cours</th>
                                    <th>Horaire</th>
                                    <th>Statut</th>
                                    <th>Justificatif</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="absences-body">
                                <tr><td colspan="6" class="text-center py-4">
                                    <div class="spinner-border spinner-border-sm text-primary me-2"></div>Chargement…
                                </td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" th:src="@{/js/absences.js}"></script>
    <script th:src="@{/js/pwa.js}"></script>
</body>
</html>
