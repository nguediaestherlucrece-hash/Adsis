<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/bootstrap-layout :: head('Mes absences', 'absences.css')}"></head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div th:replace="~{fragments/bootstrap-layout :: sidebar-etudiant('absences')}"></div>

            <div class="col-lg-10 col-md-9 col-sm-12 p-3 p-md-4 main-content">
                <h5>Relevé d’absences</h5>
                <table class="table table-striped mt-3" id="absences-table">
                    <thead>
                        <tr><th>Date</th><th>Cours</th><th>Statut</th><th>Justificatif</th></tr>
                    </thead>
                    <tbody id="absences-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" th:src="@{/js/absences.js}"></script>
</body>
</html>
