<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/bootstrap-layout :: head-etudiant('Dashboard étudiant', 'dashboardetu.css')}"></head>

<body>
    <div class="container-fluid">
        <div class="row min-vh-100">
            <aside th:replace="~{fragments/sidebar :: sidebar(activePage='dashboard', role='ETUDIANT')}"></aside>

            <div class="col-md-9 col-lg-10 p-0 d-flex flex-column main-content">
                <div class="topbar mb-4" th:replace="~{fragments/bootstrap-layout :: topbar-etudiant('Tableau de bord')}"></div>

                <div class="content p-3 p-md-4">
                    <!-- Cartes de statistiques -->
                    <section class="stats-grid mb-4" id="stats-section">
                        <div class="stat-card" id="card-absences">
                            <div class="stat-icon"><i class="bi bi-exclamation-triangle"></i></div>
                            <div class="stat-info">
                                <span class="stat-label">Total absences</span>
                                <span class="stat-value" id="stat-total-absences">—</span>
                            </div>
                        </div>
                        <div class="stat-card" id="card-injustifiees">
                            <div class="stat-icon"><i class="bi bi-x-circle"></i></div>
                            <div class="stat-info">
                                <span class="stat-label">Non justifiées</span>
                                <span class="stat-value" id="stat-injustifiees">—</span>
                            </div>
                        </div>
                        <div class="stat-card" id="card-cours">
                            <div class="stat-icon"><i class="bi bi-calendar-check"></i></div>
                            <div class="stat-info">
                                <span class="stat-label">Prochain cours</span>
                                <span class="stat-value" id="stat-prochain-cours">—</span>
                            </div>
                        </div>
                    </section>

                    <!-- Prochains cours -->
                    <div id="prochains-cours" class="mt-4">
                        <div class="section-header mb-3">
                            <i class="bi bi-calendar-week me-2"></i>
                            <h6 class="d-inline fw-bold">Prochains cours</h6>
                        </div>
                        <ul class="list-group" id="cours-list">
                            <li class="list-group-item text-muted">Chargement…</li>
                        </ul>
                    </div>

                    <!-- Absences récentes -->
                    <div id="absences-recentes" class="mt-4">
                        <div class="section-header mb-3">
                            <i class="bi bi-exclamation-circle me-2"></i>
                            <h6 class="d-inline fw-bold">Absences récentes</h6>
                            <a href="/etudiant/absences" class="float-end btn btn-sm btn-outline-primary">Voir tout</a>
                        </div>
                        <ul class="list-group" id="absences-list">
                            <li class="list-group-item text-muted">Chargement…</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Offline banner (injecté par pwa.js) -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" th:src="@{/js/dashboardetu.js}"></script>
    <script th:src="@{/js/pwa.js}"></script>
</body>
</html>
