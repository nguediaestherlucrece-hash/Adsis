<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/bootstrap-layout :: head-etudiant('Répondre à l\'appel', 'appeletu.css')}"></head>

<body>
    <div class="container-fluid">
        <div class="row min-vh-100">
            <!-- Sidebar étudiant — fragment correct -->
            <aside th:replace="~{fragments/sidebar :: sidebar(activePage='appel', role='ETUDIANT')}"></aside>

            <div class="col-md-9 col-lg-10 p-0 d-flex flex-column main-content">
                <!-- Topbar étudiant -->
                <div class="topbar mb-0" th:replace="~{fragments/bootstrap-layout :: topbar-etudiant('Appel du jour')}"></div>

                <div class="content p-3 p-md-4">

                    <!-- Message de retour -->
                    <div id="appel-message" class="alert d-none mb-3" role="alert"></div>

                    <!-- Indicateur date -->
                    <div class="d-flex align-items-center gap-2 mb-4">
                        <i class="bi bi-calendar-check text-success fs-5"></i>
                        <div>
                            <div class="fw-bold" id="date-jour">—</div>
                            <small class="text-muted">Cours programmés pour aujourd'hui</small>
                        </div>
                    </div>

                    <!-- QR Scanner card -->
                    <div class="card border-0 shadow-sm mb-4" id="scanner-card" style="display:none!important;">
                        <div class="card-header" style="background:var(--etu-primary);color:#fff;">
                            <i class="bi bi-qr-code-scan me-2"></i>Scanner le QR code de l'enseignant
                        </div>
                        <div class="card-body text-center">
                            <div id="qr-reader" style="max-width:360px;margin:0 auto;"></div>
                            <div id="qr-result" class="mt-3 d-none alert alert-success">
                                <i class="bi bi-check-circle me-2"></i>QR scanné avec succès !
                            </div>
                            <button class="btn btn-outline-secondary btn-sm mt-3" id="btn-stop-scan" style="display:none;">
                                <i class="bi bi-stop-circle me-1"></i>Arrêter le scan
                            </button>
                        </div>
                    </div>

                    <!-- Saisie code PIN -->
                    <div class="card border-0 shadow-sm mb-4" id="pin-card" style="display:none!important;">
                        <div class="card-header" style="background:var(--etu-primary);color:#fff;">
                            <i class="bi bi-lock me-2"></i>Saisir le code PIN de l'enseignant
                        </div>
                        <div class="card-body">
                            <div class="d-flex gap-2 align-items-center">
                                <input type="text" id="pin-input" class="form-control"
                                       placeholder="Code PIN à 6 chiffres" maxlength="6"
                                       pattern="\d{6}" inputmode="numeric" style="max-width:220px;"/>
                                <button class="btn btn-primary" id="btn-valider-pin">
                                    <i class="bi bi-check-lg me-1"></i>Valider
                                </button>
                            </div>
                            <div id="pin-message" class="mt-2 d-none"></div>
                        </div>
                    </div>

                    <!-- Cours du jour -->
                    <div class="card border-0 shadow-sm">
                        <div class="card-header d-flex justify-content-between align-items-center"
                             style="background:var(--etu-primary);color:#fff;">
                            <span><i class="bi bi-clock me-2"></i>Mes cours du jour</span>
                            <button class="btn btn-sm btn-outline-light" id="btn-refresh" title="Actualiser">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </div>
                        <div class="card-body p-0" id="cours-container">
                            <div class="text-center py-5 text-muted">
                                <div class="spinner-border spinner-border-sm text-success me-2"></div>
                                Chargement des cours…
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Modal QR plein écran pour scanner -->
    <div class="modal fade" id="qrScanModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header" style="background:var(--etu-primary);color:#fff;">
                    <h5 class="modal-title"><i class="bi bi-qr-code-scan me-2"></i>Scanner le QR code</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center p-3">
                    <p class="text-muted small mb-3">Pointez votre caméra vers le QR code affiché par l'enseignant</p>
                    <div id="qr-reader-modal" style="max-width:320px;margin:0 auto;"></div>
                    <div id="qr-modal-result" class="mt-3 d-none alert alert-success">
                        <i class="bi bi-check-circle me-2"></i><span id="qr-modal-text">Présence enregistrée !</span>
                    </div>
                    <div id="qr-modal-error" class="mt-3 d-none alert alert-danger">
                        <i class="bi bi-x-circle me-2"></i><span id="qr-modal-err-text"></span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal justification -->
    <div class="modal fade" id="justificationModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-file-earmark-text me-2"></i>Justifier mon absence</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Cours concerné</label>
                        <div class="alert alert-light py-2" id="justif-cours-label">—</div>
                    </div>
                    <div class="mb-3">
                        <label for="justif-motif" class="form-label fw-semibold">Motif <span class="text-danger">*</span></label>
                        <textarea id="justif-motif" class="form-control" rows="4"
                                  placeholder="Décrivez la raison de votre absence…"></textarea>
                    </div>
                    <input type="hidden" id="justif-presence-id">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-primary" id="envoyer-justif">
                        <i class="bi bi-send me-1"></i>Envoyer
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- QR Scanner library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" th:src="@{/js/appeletu.js}"></script>
    <script th:src="@{/js/pwa.js}"></script>
</body>
</html>
