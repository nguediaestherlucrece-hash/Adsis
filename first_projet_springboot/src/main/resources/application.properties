# --- CONFIGURATION DE LA BASE DE DONNÉES ---
# Option 1: MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/appel_classe_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# --- CONFIG LOCAL : Pour personnaliser (ex: mot de passe), créer un fichier 'config/application.properties' à la racine et l'ignorer dans .gitignore
spring.datasource.password=mot2passe@
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Option 2: H2 (Désactivé)
# spring.datasource.url=jdbc:h2:mem:appel_classe_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# --- HIBERNATE / JPA ---
# Utiliser 'update' pour ne pas perdre les données à chaque redémarrage
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- CONFIG SERVEUR WEB (optionnel) ---
server.port=8081
spring.application.name=Appel-classe
