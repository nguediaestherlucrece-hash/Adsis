<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADSIS – Mon profil</title>
  <style>
    /* ===== ADSIS – design system ===== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #3B55E6;
      --primary-dark: #2a3fc2;
      --primary-light: #6478f0;
      --accent: #7C3AED;
      --teal: #0d9488;
      --surface: #ffffff;
      --surface-2: #f4f6ff;
      --bg: #f0f2ff;
      --text: #1a1f36;
      --text-muted: #6b7280;
      --border: #e2e5f1;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --sidebar-w: 300px;
      --topbar-h: 64px;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 4px 20px rgba(59, 85, 230, 0.10);
      --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.07);
      --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
    }

    /* ══ SIDEBAR ══ */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-w);
      height: 100%;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 400;
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
      overflow-x: hidden;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 22px 20px 18px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
    }

    .logo-txt-fb { color: #fff; font-size: 20px; }

    .sidebar-brand {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.3px;
      flex: 1;
    }

    .sidebar-close {
      display: none;
      background: none;
      border: none;
      font-size: 1.4rem;
      line-height: 1;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 6px;
      transition: background var(--transition), color var(--transition);
    }

    .sidebar-close:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .sidebar-etab {
      padding: 16px 20px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .etab-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
    }

    .etab-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }

    .sidebar-nav {
      flex: 1;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 0.93rem;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      transition: background var(--transition), color var(--transition);
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: var(--font);
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
    }

    .nav-item:hover {
      background: var(--surface-2);
      color: var(--primary);
    }

    .nav-item.active {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(59, 85, 230, 0.28);
    }

    /* ══ OVERLAY ══ */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 399;
      backdrop-filter: blur(2px);
      cursor: pointer;
    }

    .sidebar-overlay.open { display: block; }

    /* ══ MAIN WRAP ══ */
    .main-wrap {
      margin-left: var(--sidebar-w);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: margin-left 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ══ TOPBAR ══ */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      min-height: var(--topbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    }

    .burger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 6px;
      border-radius: 8px;
      flex-shrink: 0;
      transition: background var(--transition);
      -webkit-tap-highlight-color: transparent;
    }

    .burger:hover { background: var(--surface-2); }

    .burger span {
      display: block;
      width: 22px;
      height: 2.5px;
      background: var(--text);
      border-radius: 2px;
      pointer-events: none;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text);
      flex-shrink: 0;
      transition: background var(--transition), border-color var(--transition), color var(--transition);
    }

    .back-btn:hover {
      background: var(--surface-2);
      border-color: var(--primary);
      color: var(--primary);
    }

    .topbar-title {
      flex: 1;
      min-width: 0;
    }

    .topbar-title h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-date {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .topbar-user {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .user-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .user-email {
      font-size: 0.73rem;
      color: var(--text-muted);
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      font-weight: 700;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      user-select: none;
    }

    /* ══ CONTENT ══ */
    .content {
      flex: 1;
      padding: 24px 28px;
      max-width: 900px;
      width: 100%;
    }

    /* ══ PROFILE HERO ══ */
    .profile-hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: var(--shadow-card);
      animation: fadeUp 0.35s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .profile-avatar-wrap {
      position: relative;
      margin-bottom: 4px;
    }

    .profile-avatar {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      font-size: 2rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(59, 85, 230, 0.3);
      user-select: none;
    }

    .profile-hero-info { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .profile-hero-info h2 { font-size: 1.3rem; font-weight: 800; color: var(--text); }

    .prof-role-badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 99px;
      padding: 4px 14px;
      margin-top: 4px;
    }

    /* ══ PROFILE SECTION ══ */
    .profile-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-card);
      animation: fadeUp 0.35s both;
    }

    .profile-section:nth-child(2) { animation-delay: 0.08s; }
    .profile-section:nth-child(3) { animation-delay: 0.14s; }
    .profile-section:nth-child(4) { animation-delay: 0.20s; }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .section-heading svg { color: var(--primary); }

    /* ══ FORM ══ */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .form-field { display: flex; flex-direction: column; gap: 7px; }
    .form-field-full { grid-column: 1 / -1; }

    .form-field label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .form-field input,
    .form-field select {
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      color: var(--text);
      background: #f9faff;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
      font-family: var(--font);
    }

    .form-field input:focus,
    .form-field select:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(59, 85, 230, 0.1);
    }

    .form-field input:disabled,
    .form-field select:disabled {
      background: var(--surface-2);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    .form-field input::placeholder { color: #c4c9dc; }

    /* ══ BUTTONS ══ */
    .form-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 22px;
    }

    .btn-save {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 13px 24px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(59, 85, 230, 0.35);
      transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
      font-family: var(--font);
    }

    .btn-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(59, 85, 230, 0.4);
    }

    .btn-save:active { transform: translateY(0); }
    .btn-save:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

    .btn-secondary {
      background: linear-gradient(135deg, #374151, #1f2937);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    .btn-secondary:hover { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); }

    /* ══ LOGOUT SECTION ══ */
    .logout-section {
      background: linear-gradient(135deg, #fff5f5, #fef2f2);
      border: 1.5px solid #fecaca;
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      animation: fadeUp 0.35s 0.24s both;
    }

    .logout-info h3 {
      font-size: 1rem;
      font-weight: 800;
      color: #991b1b;
      margin-bottom: 4px;
    }

    .logout-info p {
      font-size: 0.84rem;
      color: #b91c1c;
      margin: 0;
    }

    .btn-logout {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 12px 22px;
      background: var(--danger);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
      transition: transform var(--transition), box-shadow var(--transition);
      font-family: var(--font);
      flex-shrink: 0;
      white-space: nowrap;
    }

    .btn-logout:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.45);
      background: #dc2626;
    }

    .btn-logout:active { transform: translateY(0); }

    /* ══ FEEDBACK ══ */
    .save-feedback {
      margin-top: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      min-height: 20px;
      text-align: right;
    }

    .save-feedback.success { color: var(--success); }
    .save-feedback.error   { color: var(--danger); }

    /* ══ TOAST ══ */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 9000;
      white-space: nowrap;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
      max-width: calc(100vw - 32px);
      text-align: center;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success-toast { background: var(--success); }
    .toast.error-toast   { background: var(--danger); }

    /* ══ MODAL DE CONFIRMATION ══ */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 8000;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.open { display: flex; }

    .modal-box {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 32px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      animation: fadeUp 0.25s both;
    }

    .modal-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #fef2f2;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
    }

    .modal-box h3 { font-size: 1.15rem; font-weight: 800; color: var(--text); margin-bottom: 10px; }
    .modal-box p  { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 24px; }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn-modal-cancel {
      padding: 10px 22px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: var(--font);
      transition: background var(--transition);
    }

    .btn-modal-cancel:hover { background: var(--surface-2); }

    .btn-modal-confirm {
      padding: 10px 22px;
      border: none;
      border-radius: 10px;
      background: var(--danger);
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: var(--font);
      transition: background var(--transition), transform var(--transition);
    }

    .btn-modal-confirm:hover { background: #dc2626; transform: translateY(-1px); }

    /* ══ RESPONSIVE ══ */
    @media (max-width: 1024px) { :root { --sidebar-w: 260px; } }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        width: min(300px, 85vw);
        z-index: 500;
      }

      .sidebar.open {
        transform: translateX(0);
        box-shadow: 6px 0 40px rgba(0, 0, 0, 0.22);
      }

      .sidebar-close { display: flex; align-items: center; justify-content: center; }
      .sidebar-overlay.open { display: block; }
      .main-wrap { margin-left: 0 !important; }
      .burger { display: flex; }
      .user-info { display: none; }
      .topbar { padding: 0 14px; gap: 10px; }
      .content { padding: 16px 14px; }

      .logout-section {
        flex-direction: column;
        text-align: center;
        align-items: center;
      }
    }

    @media (max-width: 700px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-field-full { grid-column: 1; }
    }

    @media (max-width: 520px) {
      .profile-hero { padding: 24px 16px; }
      .profile-section { padding: 20px 16px; }
      .btn-save { width: 100%; justify-content: center; }
      .form-actions { justify-content: stretch; }
    }
  </style>
</head>

<body>
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img src="../assets/image.png" alt="ADSIS"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
        <span class="logo-txt-fb" style="display:none;">✔</span>
      </div>
      <span class="sidebar-brand">ADSIS</span>
      <button class="sidebar-close" id="sidebar-close" aria-label="Fermer">✕</button>
    </div>
    <div class="sidebar-etab">
      <span class="etab-label">ÉTABLISSEMENT</span>
      <span class="etab-name" id="sb-etab">Saint Jean Ingénieur</span>
    </div>
    <!-- Les liens de nav seront injectés dynamiquement par JS -->
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
  </aside>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- MAIN -->
  <div class="main-wrap">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="Ouvrir le menu">
        <span></span><span></span><span></span>
      </button>
      <button class="back-btn" onclick="history.back()" aria-label="Retour">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20">
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </button>
      <div class="topbar-title">
        <h2>Mon profil</h2>
        <p id="page-date" class="topbar-date"></p>
      </div>
      <div class="topbar-user">
        <div class="user-info">
          <span id="user-name-top" class="user-name"></span>
          <span id="user-email-top" class="user-email"></span>
        </div>
        <div class="avatar" id="user-avatar">—</div>
      </div>
    </header>

    <main class="content">
      <!-- HERO -->
      <div class="profile-hero">
        <div class="profile-avatar-wrap">
          <div class="profile-avatar" id="prof-avatar">—</div>
        </div>
        <div class="profile-hero-info">
          <h2 id="prof-name">—</h2>
          <p id="prof-role-label" style="font-size:0.72rem;font-weight:700;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;"></p>
          <span id="role-badge-container"></span>
        </div>
      </div>

      <!-- SECTION — Informations personnelles -->
      <div class="profile-section">
        <div class="section-heading">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          Informations personnelles
        </div>
        <div class="form-grid">
          <div class="form-field">
            <label for="f-prenom">Prénom</label>
            <input type="text" id="f-prenom" placeholder="Prénom" />
          </div>
          <div class="form-field">
            <label for="f-nom">Nom</label>
            <input type="text" id="f-nom" placeholder="Nom" />
          </div>
          <div class="form-field form-field-full">
            <label for="f-email">Email</label>
            <input type="email" id="f-email" placeholder="email@adsis.com" />
          </div>
          <div class="form-field">
            <label for="f-tel">Téléphone</label>
            <input type="tel" id="f-tel" placeholder="+221 77 000 00 00" />
          </div>
          <div class="form-field">
            <label for="f-adresse">Adresse</label>
            <input type="text" id="f-adresse" placeholder="Ville, Pays" />
          </div>
          <div class="form-field form-field-full">
            <label for="f-etab">Établissement</label>
            <input type="text" id="f-etab" value="Saint Jean Ingénieur" disabled />
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-save" id="btn-save">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
              <polyline points="17 21 17 13 7 13 7 21" />
              <polyline points="7 3 7 8 15 8" />
            </svg>
            Enregistrer les modifications
          </button>
        </div>
        <div class="save-feedback" id="save-feedback"></div>
      </div>

      <!-- SECTION — Sécurité -->
      <div class="profile-section">
        <div class="section-heading">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          Sécurité — Changer le mot de passe
        </div>
        <div class="form-grid">
          <div class="form-field form-field-full">
            <label for="f-pw-cur">Mot de passe actuel</label>
            <input type="password" id="f-pw-cur" placeholder="••••••••" />
          </div>
          <div class="form-field">
            <label for="f-pw-new">Nouveau mot de passe</label>
            <input type="password" id="f-pw-new" placeholder="••••••••" />
          </div>
          <div class="form-field">
            <label for="f-pw-conf">Confirmer</label>
            <input type="password" id="f-pw-conf" placeholder="••••••••" />
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-save btn-secondary" id="btn-change-pw">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
              <rect x="3" y="11" width="18" height="11" rx="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            Changer le mot de passe
          </button>
        </div>
        <div class="save-feedback" id="pw-feedback"></div>
      </div>

      <!-- SECTION — Déconnexion -->
      <div class="logout-section">
        <div class="logout-info">
          <h3>Se déconnecter</h3>
          <p>Terminer votre session en cours sur cet appareil.</p>
        </div>
        <button class="btn-logout" id="btn-logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          Se déconnecter
        </button>
      </div>
    </main>
  </div><!-- /main-wrap -->

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- MODAL DE CONFIRMATION DÉCONNEXION -->
  <div class="modal-overlay" id="logout-modal">
    <div class="modal-box">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" width="28" height="28">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </div>
      <h3>Confirmer la déconnexion</h3>
      <p>Êtes-vous sûr de vouloir vous déconnecter ? Votre session sera terminée.</p>
      <div class="modal-actions">
        <button class="btn-modal-cancel" id="logout-cancel">Annuler</button>
        <button class="btn-modal-confirm" id="logout-confirm">Se déconnecter</button>
      </div>
    </div>
  </div>

  <script type="module" src="../script/shared.js"></script>
  <script type="module" src="../script/profile-unified.js"></script>
</body>

</html>
